# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    groups:
      testing-tools:
        patterns:
          - "io.mockk:mockk-jvm"
          - "com.tngtech.archunit:archunit-junit5"
          - "org.testcontainers:*"

  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/frontend/src/main/webapp" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    ignore:
      - dependency-name: "eslint"
        versions: [ "10.x" ]
      - dependency-name: "typescript"
        versions: [ ">= 6.0.0" ]
    groups:
      angular:
        patterns:
          - "@angular/*"           # Core framework
          - "@angular-devkit/*"    # Build tools & schematics
          - "@angular-eslint/*"    # Linting rules
          - "@angular/build"       # New build system
          - "@angular/cli"         # CLI
          - "@angular/compiler-cli"
          - "rxjs*"                # Reactive extensions
          - "typescript"           # Language
          - "tslib"                # Runtime library
      charts:
        patterns:
          - "chart.js"
          - "ng2-charts"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@angular-eslint/*"
          - "@typescript-eslint/*"
          - "prettier" # Included because you use eslint-config-prettier
      testing-tools:
        patterns:
          - "cypress"
          - "@cypress/*"
          - "cypress-*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "wait-on"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/_build"
    schedule:
      interval: "daily"
    ignore:
      # A JDK major bump (e.g. 26-alpine -> 27-alpine) needs coordinating with the Gradle toolchain
      # version, so that stays a manual decision - but the base image is pinned by digest, so a
      # same-tag digest refresh (e.g. Amazon rebuilding 26-alpine with a patched libssl3) should
      # still come through automatically instead of sitting frozen on today's digest forever.
      - dependency-name: "amazoncorretto"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 50