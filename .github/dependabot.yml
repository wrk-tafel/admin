# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Every ecosystem below pins `commit-message` explicitly instead of leaving the wording to
# Dependabot's auto-detection from git history. release.yml's version job derives the next release
# number from the Conventional Commits type of the squashed commit - which for a PR is its title -
# so the `type(scope):` prefix has to be guaranteed rather than inferred; an undetected convention
# would silently produce "Bump X from a to b" and a mis-bumped release.
#
# What this cannot pin is the length: Dependabot composes the rest itself as
# "bump <dep> from <old> to <new> in <directory> in the <group> group", which for a nested manifest
# path or a grouped update runs past the 100-character header cap on its own. That is why
# commitlint.config.cjs relaxes header-max-length to 150 and pull_request.yml exempts
# Dependabot-authored pull requests from the title check.
version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps)"
    groups:
      testing-tools:
        patterns:
          - "io.mockk:mockk-jvm"
          - "com.tngtech.archunit:archunit-junit5"
          - "org.testcontainers:*"

  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/frontend/src/main/webapp" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "eslint"
        versions: [ "10.x" ]
      - dependency-name: "typescript"
        versions: [ ">= 6.0.0" ]
    groups:
      angular:
        patterns:
          - "@angular/*"           # Core framework
          - "@angular-devkit/*"    # Build tools & schematics
          - "@angular-eslint/*"    # Linting rules
          - "@angular/build"       # New build system
          - "@angular/cli"         # CLI
          - "@angular/compiler-cli"
          - "rxjs*"                # Reactive extensions
          - "typescript"           # Language
          - "tslib"                # Runtime library
      charts:
        patterns:
          - "chart.js"
          - "ng2-charts"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@angular-eslint/*"
          - "@typescript-eslint/*"
          - "prettier" # Included because you use eslint-config-prettier
      testing-tools:
        patterns:
          - "cypress"
          - "@cypress/*"
          - "cypress-*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "wait-on"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/_build"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps)"
