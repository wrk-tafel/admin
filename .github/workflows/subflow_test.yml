name: Test

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend:
        description: 'Run the frontend unit tests - pass false when the change cannot affect the frontend'
        type: boolean
        required: false
        default: true
      backend:
        description: 'Run the backend tests - pass false only on a pull request that cannot affect the backend, and see the note on the job below before doing so'
        type: boolean
        required: false
        default: true

jobs:
  test-backend:
    # This job is the pipeline's longest (~7 minutes) and it also feeds the sonar analysis, which
    # consumes the jacoco report uploaded below - an analysis without it reports the whole backend as
    # uncovered. It is therefore gated only where that is harmless, which is a pull request whose
    # diff cannot touch the backend: SonarCloud's pull-request analyses measure new code, and a
    # frontend-only pull request adds no backend line to measure. The push pipelines pass nothing
    # here and keep running it, so the coverage stored for `main` always comes from a real run.
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Backend test
        run: ./gradlew :backend:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-custom-test-results
          path: ./backend/build/custom-test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-jacoco-report
          path: ./backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  test-frontend:
    # inputs.* are unset on a manual run, which should exercise everything.
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/src/main/webapp/package-lock.json'
      - run: npm ci --ignore-scripts
        working-directory: frontend/src/main/webapp
      - name: Frontend test
        run: npm run test-ci
        working-directory: frontend/src/main/webapp
      # The counterpart to the backend's jacoco report above: without this the lcov path configured
      # in the root build.gradle.kts never exists in the sonar job's workspace, and frontend coverage
      # is silently missing from the analysis (#3652).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-lcov-report
          path: ./frontend/src/main/webapp/coverage/ng/lcov.info
          if-no-files-found: error
          retention-days: 1
