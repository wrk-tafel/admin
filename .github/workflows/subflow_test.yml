name: Test

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      frontend:
        description: 'Run the frontend unit tests - pass false when the change cannot affect the frontend'
        type: boolean
        required: false
        default: true

jobs:
  test-backend:
    # Deliberately not gated on whether the backend changed: the sonar analysis consumes the jacoco
    # report uploaded below, and an analysis without it reports the whole backend as uncovered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Backend test
        run: ./gradlew :backend:test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: backend-custom-test-results
          path: ./backend/build/custom-test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-jacoco-report
          path: ./backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  test-frontend:
    # inputs.* are unset on a manual run, which should exercise everything.
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/src/main/webapp/package-lock.json'
      - run: npm ci --ignore-scripts
        working-directory: frontend/src/main/webapp
      - name: Frontend test
        run: npm run test-ci
        working-directory: frontend/src/main/webapp
