name: Pull Request

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Keyed off who *authored* the pull request, not github.actor: the actor is whoever triggered
    # this particular run, so any human touch on a Dependabot PR - merging main into it, editing
    # the title, re-running a job - silently drops the exemption and lints a message nobody on the
    # team wrote. Dependabot's auto-generated wording is deliberately exempt here (see
    # commitlint.config.cjs), and that has to hold for every run on such a PR, not just the ones
    # Dependabot itself kicked off.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          helpURL: https://www.conventionalcommits.org
  pr-title-lint:
    # Squash-merged PRs (squash_merge_commit_title: PR_TITLE in repo settings) use the PR title as
    # the final commit on the target branch, so the title needs the same Conventional Commits check
    # as individual commits above — otherwise release.yml's version bump can't see the intent.
    runs-on: ubuntu-latest
    # Author-based for the same reason as the commitlint job above.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: read
    steps:
      # subjectPattern mirrors the commitlint job's config-conventional rules (no leading
      # uppercase, no trailing period) so a title can't pass this check and fail that one.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No leading uppercase, no trailing period, and a length cap that keeps the full
          # "type(scope)!: description" header under 100 chars even with a long type+scope
          # prefix. This is intentionally stricter than commitlint.config.js's 150-char
          # header-max-length, which was raised only to stop Dependabot's longer
          # auto-generated commit messages from failing that check; human-authored titles
          # should stay concise regardless.
          subjectPattern: ^(?![A-Z]).{0,79}[^.]$
          subjectPatternError: |
            The description "{subject}" found in title "{title}" must start with a lowercase
            letter, must not end with a period, and (with its type/scope prefix) must keep the
            whole title under 100 characters — matches the commitlint check on commits.
  # Every job below is gated on what this pull request actually touches, so a docs-only change (or
  # a title/description edit, which re-triggers this workflow with unchanged commits) costs nothing
  # beyond the two lint jobs above. See subflow_changes.yml for the classification rules.
  changes:
    uses: ./.github/workflows/subflow_changes.yml
  build:
    # Both artifacts are built whenever the application changed at all: the image and the e2e run
    # need the jar and the frontend bundle together, no matter which of the two was edited.
    uses: ./.github/workflows/subflow_build.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
  test:
    uses: ./.github/workflows/subflow_test.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      # Only a pull request skips the backend suite, and only when the diff cannot reach it - see
      # the note on that job. main_push.yml deliberately passes nothing and always runs it.
      backend: ${{ needs.changes.outputs.backend == 'true' }}
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      docker: ${{ needs.changes.outputs.docker == 'true' }}
  codeql:
    uses: ./.github/workflows/subflow_codeql.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
  # sonar and e2e-test need no gate of their own: they depend on build/test, and GitHub skips a job
  # whose dependency was skipped. The image and the deploy below carry one anyway, for who rather
  # than for what changed.
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: build
    # On a pull request the image exists only to be deployed to dev, and deploy-dev below never runs
    # for Dependabot. Building and pushing one anyway costs a runner and leaves a tag in the registry
    # for cleanup.yml to reap, so the two carry the same condition.
    if: github.actor != 'dependabot[bot]'
    with:
      # the mutable "dev" tag always points at the most recently built candidate for that
      # environment, which is what cleanup.yml keys off to protect it regardless of how many
      # newer commit-SHA-tagged images have since piled up (#3631)
      imageTags: |
        ${{ github.event.pull_request.head.sha }}
        dev
      version: ${{ github.event.pull_request.head.sha }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  deploy-dev:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: build-push-image
    with:
      environment: dev
      # The shortened SHA the image was actually tagged with, resolved by the build workflow.
      version: ${{ needs.build-push-image.outputs.version }}
    concurrency:
      group: dev-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
    if: github.actor != 'dependabot[bot]'
