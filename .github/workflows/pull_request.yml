name: Pull Request

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          helpURL: https://www.conventionalcommits.org
  pr-title-lint:
    # Squash-merged PRs (squash_merge_commit_title: PR_TITLE in repo settings) use the PR title as
    # the final commit on the target branch, so the title needs the same Conventional Commits check
    # as individual commits above — otherwise release.yml's version bump can't see the intent.
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: read
    steps:
      # subjectPattern mirrors the commitlint job's config-conventional rules (no leading
      # uppercase, no trailing period) so a title can't pass this check and fail that one.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No leading uppercase, no trailing period, and a length cap that keeps the full
          # "type(scope)!: description" header under 100 chars even with a long type+scope
          # prefix. This is intentionally stricter than commitlint.config.js's 150-char
          # header-max-length, which was raised only to stop Dependabot's longer
          # auto-generated commit messages from failing that check; human-authored titles
          # should stay concise regardless.
          subjectPattern: ^(?![A-Z]).{0,79}[^.]$
          subjectPatternError: |
            The description "{subject}" found in title "{title}" must start with a lowercase
            letter, must not end with a period, and (with its type/scope prefix) must keep the
            whole title under 100 characters — matches the commitlint check on commits.
  build:
    uses: ./.github/workflows/subflow_build.yml
  test:
    uses: ./.github/workflows/subflow_test.yml
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine short commit SHA
        id: version
        env:
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "version=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, version]
    with:
      imageTags: ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  # TEMPORARY - added to let the userguide PDF be tested from a PR run before release.yml's
  # equivalent job (which this is copied from) actually ships it. Remove this whole job once
  # testing is done.
  userguide-pdf-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'docs/userguide/package-lock.json'
      - run: npm ci --ignore-scripts
        working-directory: docs/userguide
      - name: Combine userguide chapters into one markdown file
        run: |
          cd docs/userguide
          cp README.md combined.md
          for chapter in anmeldung kunden logistik benutzer einstellungen statistiken; do
            printf '\n<div style="page-break-before: always;"></div>\n\n' >> combined.md
            cat "$chapter.md" >> combined.md
          done
          sed -E -i 's/\]\((anmeldung|kunden|logistik|benutzer|einstellungen|statistiken|README)\.md#([^)]+)\)/](#\2)/g' combined.md
          sed -E -i 's/\]\((anmeldung|kunden|logistik|benutzer|einstellungen|statistiken)\.md\)/](#kapitel-\1)/g' combined.md
      - name: Render userguide PDF
        run: |
          CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome/Chromium executable found on this runner" >&2
            exit 1
          fi
          node_modules/.bin/md-to-pdf combined.md --document-title "Tafel Admin – Benutzerhandbuch" --launch-options "{\"executablePath\":\"$CHROME_PATH\",\"args\":[\"--no-sandbox\"]}"
        working-directory: docs/userguide
      - name: Rename PDF to release asset name
        run: mv docs/userguide/combined.pdf tafel-admin-benutzerhandbuch.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: userguide-pdf
          path: tafel-admin-benutzerhandbuch.pdf
          if-no-files-found: error
          retention-days: 7
  deploy-dev:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: [build-push-image, version]
    with:
      environment: dev
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: dev-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
    if: github.actor != 'dependabot[bot]'
