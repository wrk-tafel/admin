name: Build and push the docker image

env:
  REGISTRY: ghcr.io

on:
  workflow_call:
    inputs:
      imageTags:
        description: 'Newline-separated list of tags to push the image as, e.g. "latest\n1.0.0". A tag that is a full commit SHA is shortened to 7 chars, so a caller can pass github.sha straight through.'
        type: string
        required: true
      version:
        description: 'Baked into the image as TAFELADMIN_VERSION and shown in the frontend UI, e.g. "1.0.0", or a full commit SHA for non-release builds (auto-shortened to 7 chars below)'
        type: string
        required: true
    outputs:
      imageRef:
        description: 'Fully qualified reference of the pushed image, for a caller that wants to scan or otherwise act on it (see subflow_image_scan.yml)'
        value: ${{ jobs.build.outputs.primaryTag }}
      version:
        description: 'The version as it was actually baked in and tagged - i.e. shortened when a full commit SHA was passed. This is the tag a deploy has to ask for.'
        value: ${{ jobs.build.outputs.version }}
    secrets:
      githubToken:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      primaryTag: ${{ steps.tags.outputs.primaryTag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: admin-jarfile
          path: ./artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: ./frontend-dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.githubToken }}
      - name: Build full image tags
        id: tags
        env:
          IMAGE_TAGS: ${{ inputs.imageTags }}
        run: |
          # A full commit SHA (40 hex chars) becomes the conventional 7, matching what the metadata
          # step below bakes in as the version. This is what lets a caller pass github.sha straight
          # through instead of running a whole job to compute `${SHA:0:7}` - GitHub expressions have
          # no substring function. A release semver or a mutable name like "dev" passes through.
          shorten() {
            if [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then printf '%s' "${1:0:7}"; else printf '%s' "$1"; fi
          }
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "${REGISTRY}/wrk-tafel/admin:$(shorten "$tag")"
            done <<< "${IMAGE_TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # Any one of the pushed tags refers to the same image, so a caller that wants to pull it
          # (the scan workflow) just needs the first one.
          echo "primaryTag=${REGISTRY}/wrk-tafel/admin:$(shorten "$(head -n1 <<< "${IMAGE_TAGS}")")" >> "$GITHUB_OUTPUT"
      - name: Determine build metadata
        id: metadata
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          # A full git commit SHA (40 hex chars) is shortened to the conventional 7 for
          # display; a release semver (e.g. "1.0.0") never matches this and passes through as-is.
          if [[ "$version" =~ ^[0-9a-f]{40}$ ]]; then
            version="${version:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: _build/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_TIME=${{ steps.metadata.outputs.buildTime }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
