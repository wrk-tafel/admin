name: Build and push the docker image

env:
  REGISTRY: ghcr.io

on:
  workflow_call:
    inputs:
      imageTags:
        description: 'Newline-separated list of tags to push the image as, e.g. "latest\n1.0.0"'
        type: string
        required: true
      version:
        description: 'Baked into the image as TAFELADMIN_VERSION and shown in the frontend UI, e.g. "1.0.0", or a full commit SHA for non-release builds (auto-shortened to 7 chars below)'
        type: string
        required: true
    secrets:
      githubToken:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: admin-jarfile
          path: ./artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: ./frontend-dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.githubToken }}
      - name: Build full image tags
        id: tags
        env:
          IMAGE_TAGS: ${{ inputs.imageTags }}
        run: |
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "${REGISTRY}/wrk-tafel/admin:${tag}"
            done <<< "${IMAGE_TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # Any one of the pushed tags refers to the same image, so the scan step below just
          # needs the first one to have something to pull.
          echo "primaryTag=${REGISTRY}/wrk-tafel/admin:$(head -n1 <<< "${IMAGE_TAGS}")" >> "$GITHUB_OUTPUT"
      - name: Determine build metadata
        id: metadata
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          # A full git commit SHA (40 hex chars) is shortened to the conventional 7 for
          # display; a release semver (e.g. "1.0.0") never matches this and passes through as-is.
          if [[ "$version" =~ ^[0-9a-f]{40}$ ]]; then
            version="${version:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: _build/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_TIME=${{ steps.metadata.outputs.buildTime }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.primaryTag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Without this, trivy-action builds the SARIF with all severities regardless of the
          # `severity` filter above (that filter only applies to non-SARIF output formats).
          limit-severities-for-sarif: true
          ignore-unfixed: true
      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
