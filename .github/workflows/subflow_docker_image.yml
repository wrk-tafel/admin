name: Build and push the docker image

env:
  REGISTRY: ghcr.io

on:
  workflow_call:
    inputs:
      imageTags:
        description: 'Newline-separated list of tags to push the image as, e.g. "latest\n1.0.0"'
        type: string
        required: true
      version:
        description: 'Baked into the image as TAFELADMIN_VERSION and shown in the frontend UI, e.g. "1.0.0" or a short commit SHA for non-release builds'
        type: string
        required: true
    secrets:
      githubToken:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: admin-jarfile
          path: ./artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: ./frontend-dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to the Container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.githubToken }}
      - name: Build full image tags
        id: tags
        env:
          IMAGE_TAGS: ${{ inputs.imageTags }}
        run: |
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "${REGISTRY}/wrk-tafel/admin:${tag}"
            done <<< "${IMAGE_TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Determine build time
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: _build/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
