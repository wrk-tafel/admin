name: Update Gradle Lock File

# Dependabot's native Gradle lockfile update support is unreliable for this
# repo's setup (version catalog + multi-module project), see:
# https://github.com/dependabot/dependabot-core/issues/12557
# https://github.com/dependabot/dependabot-core/issues/14633
# This workflow regenerates backend/gradle.lockfile and
# gradle/verification-metadata.xml on Dependabot gradle PRs so the build
# can't land broken because of a stale lock/checksum.

on:
  pull_request:
    paths:
      # The version catalog is the only path a Dependabot gradle PR is
      # guaranteed to touch — every dependency coordinate lives there, none are
      # declared inline in the build scripts. Listing the build scripts and the
      # lock/checksum files as well only queues the workflow on ordinary PRs,
      # where the actor guard below reports it as a skipped run.
      - 'gradle/libs.versions.toml'

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Regenerate lock file and verification metadata
        run: ./gradlew --write-locks --write-verification-metadata sha256 :backend:build --console=plain
      - name: Commit changes if any
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # A push authenticated with the default GITHUB_TOKEN never triggers `pull_request:
          # synchronize` (GitHub suppresses workflow runs started by the default token, to avoid
          # recursive runs), so pushing with it leaves this commit - the one that fixes the PR -
          # with no CI run against it at all. A PAT belonging to an account other than this
          # workflow's own token isn't subject to that suppression. Add a fine-grained PAT with
          # "Contents: write" on this repo as the DEPENDABOT_LOCKFILE_PAT repository secret to
          # enable that; without it, the commit still pushes (so the branch stays correct) but
          # falls back to the same unchecked push this replaces.
          PUSH_TOKEN: ${{ secrets.DEPENDABOT_LOCKFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain backend/gradle.lockfile settings-gradle.lockfile gradle/verification-metadata.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/gradle.lockfile settings-gradle.lockfile gradle/verification-metadata.xml
            git commit -m "build(deps): update gradle lockfile and verification metadata"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$HEAD_REF"
          fi
