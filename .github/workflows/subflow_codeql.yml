name: CodeQL

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      backend:
        description: 'Analyze Kotlin/Java sources - pass false when the change cannot affect the backend sources'
        type: boolean
        required: false
        default: true
      frontend:
        description: 'Analyze TypeScript/JavaScript sources - pass false when the change cannot affect the frontend sources'
        type: boolean
        required: false
        default: true

jobs:
  # inputs.* are unset on a manual run, which should exercise everything.
  codeql-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.backend }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build backend
        # Compiles main and test sources without running the test suite itself (that's
        # subflow_test.yml's job) - CodeQL only needs the compiled bytecode to extract from.
        run: ./gradlew :backend:classes :backend:testClasses
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:java-kotlin'

  codeql-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.frontend }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:javascript-typescript'
