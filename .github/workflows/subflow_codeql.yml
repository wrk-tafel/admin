name: CodeQL

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      backend:
        description: 'Analyze Kotlin/Java sources - pass false when the change cannot affect the backend sources'
        type: boolean
        required: false
        default: true
      frontend:
        description: 'Analyze TypeScript/JavaScript sources - pass false when the change cannot affect the frontend sources'
        type: boolean
        required: false
        default: true

jobs:
  # inputs.* are unset on a manual run, which should exercise everything.
  codeql-backend:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.backend }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build backend
        # Compiles the main sources only. CodeQL extracts whatever the compiler reads during this
        # step, so this is also what decides which files get analyzed: for compiled languages the
        # config file's `paths`/`paths-ignore` are NOT applied (they only filter interpreted
        # languages), so the only way to keep the test sources out of the analysis is to not compile
        # them here. They are left out on purpose - the MockK `verify { response.addCookie(...) }`
        # calls in UserControllerTest/TafelLoginFilterTest are permanent java/insecure-cookie false
        # positives (the mocked cookie never has setSecure() called on it in the test itself), and
        # Kotlin has no AlertSuppression.ql, so a `// codeql[...]` comment cannot silence them
        # either (https://github.com/github/codeql/issues/21637). Sonar still analyzes the tests.
        # --rerun-tasks forces the compiler to actually run: CodeQL's tracer only sees a source file
        # if the compiler process that reads it runs during this step, so an UP-TO-DATE/FROM-CACHE
        # compile (e.g. this exact backend source was already built by an earlier run, which is
        # common for a workflow-only change) leaves nothing for CodeQL to extract and fails the job
        # with "CodeQL could not process any code written in Java/Kotlin".
        run: ./gradlew :backend:classes --rerun-tasks
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:java-kotlin'

  codeql-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.frontend }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:javascript-typescript'
