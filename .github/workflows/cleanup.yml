name: Cleanup old workflow runs and package versions

on:
  workflow_dispatch:
  schedule:
    - cron: '00 8 * * *'

jobs:
  delete-workflow-runs:
    runs-on: ubuntu-latest
    name: Delete old workflow runs
    permissions:
      actions: write
    steps:
      # MajorScruffy/delete-old-workflow-runs is archived/unmaintained (still declares a node12
      # runtime), so this is inlined via gh api instead of depending on it.
      - name: Delete workflow runs older than 2 weeks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wrk-tafel/admin
        run: |
          cutoff=$(date -d '14 days ago' +%s)
          gh api "repos/${REPO}/actions/runs" --paginate --jq '.workflow_runs[] | [.id, .created_at] | @tsv' |
            while IFS=$'\t' read -r id created_at; do
              created_ts=$(date -d "$created_at" +%s)
              if [ "$created_ts" -lt "$cutoff" ]; then
                echo "Deleting run $id (created $created_at)"
                gh api -X DELETE "repos/${REPO}/actions/runs/${id}" || true
              fi
            done

  delete-package-versions:
    runs-on: ubuntu-latest
    name: Delete old/unused package versions
    permissions:
      packages: write
    steps:
      # Untagged versions are orphaned image manifests left behind whenever a
      # mutable tag (dev/test/latest) moved to a new digest, plus any digest
      # no tag ever pointed to. Nothing references them, so they're safe to
      # delete outright rather than time-boxing a retention window.
      - name: Delete untagged versions of the admin container image
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: admin
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      # Every PR/main-push build tags its image with an immutable short commit
      # SHA (see pull_request.yml/main_push.yml), so these otherwise accumulate
      # forever. Keep the most recent 2 - the currently deployed dev and test
      # images - and prune the rest; release images ("latest" and semver
      # version tags) must be kept indefinitely.
      #
      # This used to be actions/delete-package-versions with an `ignore-versions`
      # regex meant to protect "latest"/semver tags. That action tests the regex
      # against the version's digest (e.g. "sha256:abcd...") rather than its
      # tags, so the regex never matched anything - it silently kept only the
      # newest 2 versions overall and deleted every release image in the
      # process (see #2891). Filtering by tag ourselves instead.
      - name: Delete old commit-SHA-tagged versions of the admin container image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: wrk-tafel
          PACKAGE: admin
          KEEP: 2
        run: |
          gh api "orgs/${OWNER}/packages/container/${PACKAGE}/versions" --paginate \
            --jq '.[] | [.id, .created_at, (.metadata.container.tags | join(","))] | @tsv' |
            sort -t $'\t' -k2,2 -r > /tmp/versions.tsv

          kept=0
          while IFS=$'\t' read -r id created_at tags; do
            [ -z "$tags" ] && continue # untagged versions are handled by the previous step

            protected=false
            IFS=',' read -ra tag_list <<< "$tags"
            for t in "${tag_list[@]}"; do
              if [[ "$t" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                protected=true
                break
              fi
            done
            if [ "$protected" = true ]; then
              echo "Keeping $id (release tag(s): $tags)"
              continue
            fi

            kept=$((kept + 1))
            if [ "$kept" -le "$KEEP" ]; then
              echo "Keeping $id (recent, tag(s): $tags)"
              continue
            fi

            echo "Deleting $id (tag(s): $tags, created $created_at)"
            gh api -X DELETE "orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}" || true
          done < /tmp/versions.tsv
