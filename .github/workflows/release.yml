name: Push on main branch

concurrency:
  group: release

on:
  workflow_dispatch:
  push:
    branches: [ 'release' ]

jobs:
  # Unlike pull_request.yml and main_push.yml this pipeline is deliberately not gated on the changed
  # files: every release produces a new version tag, a new image carrying it and a fresh userguide
  # PDF, no matter how small the change that triggered it was.
  build:
    uses: ./.github/workflows/subflow_build.yml
  test:
    uses: ./.github/workflows/subflow_test.yml
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine next version from Conventional Commits since the last tag
        id: version
        uses: paulhatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373 # v6.0.3
        with:
          tag_prefix: ""
      # CHANGELOG.md is maintained by hand, one bullet per user-facing change, always added under
      # "## [Unreleased]" (see CLAUDE.md's "Changelog" section). This step never parses that
      # heading - it diffs CHANGELOG.md against the previous release tag and keeps only added
      # bullet lines, so the extracted delta is correct even if "## [Unreleased]" hasn't been
      # renamed to a version yet, and unaffected by how many commits landed in between.
      - name: Extract changelog entries added since the last release
        id: changelog
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$previous_tag" ]; then
            entries="_Erstes Release._"
          else
            entries=$(git diff "${previous_tag}"...HEAD -- CHANGELOG.md | grep -E '^\+- ' | sed 's/^\+//' || true)
            if [ -z "$entries" ]; then
              entries="_Keine dokumentierten Änderungen für dieses Release._"
            fi
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$entries"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, test, e2e-test, version]
    with:
      imageTags: |
        latest
        ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      scanImage: true
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  userguide-pdf:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'docs/userguide/package-lock.json'
      # Installs from docs/userguide/package-lock.json (pinned version + integrity hashes) rather
      # than `npx <pkg>@version`, which resolves and installs on demand at run time - flagged by
      # SonarCloud (githubactions:S6505) as an on-demand-install / supply-chain risk.
      # --ignore-scripts additionally blocks lifecycle scripts from any (transitive) dependency -
      # otherwise flagged separately by SonarCloud/CodeQL. This also skips puppeteer's own
      # postinstall Chromium download, so the render step below points it at the runner's
      # preinstalled Google Chrome instead.
      - run: npm ci --ignore-scripts
        working-directory: docs/userguide
      - name: Combine userguide chapters into one markdown file
        run: |
          cd docs/userguide
          cp README.md combined.md
          for chapter in anmeldung kunden logistik benutzer einstellungen aenderungsprotokoll statistiken; do
            cat "$chapter.md" >> combined.md
          done
          # The chapters link to each other as separate files (e.g. "[Kunden](kunden.md)"), which
          # is correct for GitHub/IDE viewing but not once merged into one PDF: md-to-pdf serves
          # combined.md from a local http server, so an untouched "kunden.md" link would resolve
          # to that server's URL and 404 once the PDF is standalone. Every chapter file carries a
          # matching <a id="..."> anchor (at its top, and at any sub-section other chapters link
          # to directly) - the chapter-top ones are named "kapitel-<name>" rather than just
          # "<name>" because a bare id can collide with an unrelated heading's auto-generated slug
          # elsewhere in the merged document (e.g. README.md's own "## Anmeldung" section) and
          # silently jump to the wrong place. Rewrite the cross-file links into same-document
          # anchor links accordingly.
          sed -E -i 's/\]\((anmeldung|kunden|logistik|benutzer|einstellungen|aenderungsprotokoll|statistiken|README)\.md#([^)]+)\)/](#\2)/g' combined.md
          sed -E -i 's/\]\((anmeldung|kunden|logistik|benutzer|einstellungen|aenderungsprotokoll|statistiken)\.md\)/](#kapitel-\1)/g' combined.md
      # Everything about the render itself - document title, page geometry (A4 portrait, 2cm
      # margins), the page-break styles, and the footer with version/date/page numbers - lives in
      # docs/userguide/md-to-pdf.config.js rather than in CLI flags here. The two env vars below
      # are the only inputs it can't determine on its own: the release version, and the path to
      # the runner's preinstalled Chrome (see the --ignore-scripts note above for why puppeteer's
      # own Chromium isn't available).
      - name: Render userguide PDF
        env:
          USERGUIDE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome/Chromium executable found on this runner" >&2
            exit 1
          fi
          export CHROME_PATH
          node_modules/.bin/md-to-pdf combined.md --config-file md-to-pdf.config.js
        working-directory: docs/userguide
      - name: Rename PDF to release asset name
        run: mv docs/userguide/combined.pdf tafel-admin-benutzerhandbuch.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: userguide-pdf
          path: tafel-admin-benutzerhandbuch.pdf
          if-no-files-found: error
          retention-days: 1
  github-release:
    runs-on: ubuntu-latest
    needs: [version, build-push-image, userguide-pdf]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: userguide-pdf
          path: .
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: tafel-admin-benutzerhandbuch.pdf
          # Appended after `body` by the action itself - this is what gives every release its
          # "What's Changed" PR list and "Full Changelog" comparison link, on top of the
          # hand-written changelog/user-guide/image sections below.
          generate_release_notes: true
          body: |
            ## Release-Notes

            ${{ needs.version.outputs.changelog }}

            ## Benutzerhandbuch

            Das Benutzerhandbuch für diese Version:
            [tafel-admin-benutzerhandbuch.pdf](https://github.com/wrk-tafel/admin/releases/download/${{ needs.version.outputs.version }}/tafel-admin-benutzerhandbuch.pdf)

            Immer die aktuellste Version:
            https://github.com/wrk-tafel/admin/releases/latest/download/tafel-admin-benutzerhandbuch.pdf

            ## Docker-Image

            ```
            ghcr.io/wrk-tafel/admin:${{ needs.version.outputs.version }}
            ```

            Auch getaggt als `latest`. Alle Tags: https://github.com/wrk-tafel/admin/pkgs/container/admin
  deploy-test:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: [version, github-release]
    with:
      environment: test
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: test-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
  deploy-dev:
    # The release goes to dev alongside test, on the same gates: all three non-production
    # environments run the same artefact, so a report against dev is a report against the release.
    uses: ./.github/workflows/subflow_deploy.yml
    needs: [version, github-release]
    with:
      environment: dev
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: dev-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
  check-deploy-window:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Saturday event window
        env:
          TZ: Europe/Vienna
        # The app is used live Sat ~12:00-24:00 and must not restart (Flyway migrations run on
        # boot) during that window - see issue #2931. Block the whole Saturday to be safe.
        # This fails the run on purpose so a blocked prod deploy is visible instead of a silent skip.
        run: |
          day=$(date +%u) # ISO weekday, 6 = Saturday
          if [ "$day" -eq 6 ]; then
            {
              echo "### :no_entry: Prod deploy blocked"
              echo "Current day in Europe/Vienna is $(date '+%A %H:%M'). Prod deploys are blocked all day Saturday."
              echo "Re-run this workflow's failed jobs once it is no longer Saturday to deploy to prod."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Prod deploy blocked::Prod deploys are blocked all day Saturday (Europe/Vienna) - see issue #2931."
            exit 1
          fi
  deploy-prod:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: [version, github-release, check-deploy-window]
    with:
      environment: prod
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: prod-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
