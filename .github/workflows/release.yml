name: Push on main branch

concurrency:
  group: release

on:
  workflow_dispatch:
  push:
    branches: [ 'release' ]

jobs:
  build:
    uses: ./.github/workflows/subflow_build.yml
  test:
    uses: ./.github/workflows/subflow_test.yml
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine next version from Conventional Commits since the last tag
        id: version
        uses: paulhatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373 # v6.0.3
        with:
          tag_prefix: ""
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, test, e2e-test, version]
    with:
      imageTags: |
        test
        latest
        ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  github-release:
    runs-on: ubuntu-latest
    needs: [version, build-push-image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker image

            ```
            ghcr.io/wrk-tafel/admin:${{ needs.version.outputs.version }}
            ```

            Also tagged `latest`. All tags: https://github.com/wrk-tafel/admin/pkgs/container/admin
  deploy-test:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: github-release
    concurrency:
      group: test-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_TEST_COMMAND }}
  deploy-prod:
    uses: ./.github/workflows/subflow_deploy.yml
    needs: github-release
    concurrency:
      group: prod-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_PROD_COMMAND }}
