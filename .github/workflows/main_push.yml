name: Main Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Gates every job below on what the pushed commits actually touch - a docs-only merge builds no
  # image and deploys nothing, since the running test environment is already up to date. See
  # subflow_changes.yml for the classification rules.
  changes:
    uses: ./.github/workflows/subflow_changes.yml
  build:
    # Both artifacts are built whenever the application changed at all: the image and the e2e run
    # need the jar and the frontend bundle together, no matter which of the two was edited.
    uses: ./.github/workflows/subflow_build.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
  test:
    uses: ./.github/workflows/subflow_test.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine short commit SHA
        id: version
        run: echo "version=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      docker: ${{ needs.changes.outputs.docker == 'true' }}
  # sonar, build-push-image, e2e-test and deploy-test need no gate of their own: they depend on
  # build/test, and GitHub skips a job whose dependency was skipped.
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, test, version, sonar, e2e-test]
    with:
      imageTags: ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      scanImage: true
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  lighthouse:
    # Same gate as on a pull request: only a frontend change can move these numbers. Deliberately not
    # a dependency of deploy-test below - a page-performance threshold is a signal to act on, not a
    # reason to hold a merged change back from the test environment.
    uses: ./.github/workflows/subflow_lighthouse.yml
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true'
  deploy-test:
    uses: ./.github/workflows/subflow_deploy.yml
    # main is the "must be green" pipeline: unlike PRs, deployment requires
    # backend+frontend unit tests AND e2e to have passed, not just a
    # successful build
    needs: [build-push-image, test, e2e-test, version]
    with:
      environment: test
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: test-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
