name: Main Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/subflow_build.yml
  test:
    uses: ./.github/workflows/subflow_test.yml
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine short commit SHA
        id: version
        run: echo "version=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
  sonar:
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  update-module-diagram:
    # ModularityTest regenerates docs/module-structure.svg on every run from the current
    # package-info.java module boundaries (see ModularityTest.createModuleDocumentation). main is
    # protected (requires a review) and rejects direct pushes even from this job's token (see
    # #2922), so open a PR instead, only when the diagram actually changed. Note: PRs opened with
    # the default GITHUB_TOKEN don't trigger other workflows, so this PR's checks need a manual
    # re-run (e.g. an empty commit) before merge.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '26'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install Graphviz
        # PlantUML needs the `dot` binary to lay out the component diagram; without it,
        # ModularityTest.createModuleDocumentation() writes an SVG containing a "Cannot
        # find Graphviz" error graphic instead of the actual diagram (see #2906).
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Regenerate module structure diagram
        run: ./gradlew :backend:test --tests "at.wrk.tafel.admin.backend.architecture.ModularityTest"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: docs/module-structure.svg
          commit-message: "docs: update module structure diagram"
          title: "docs: update module structure diagram"
          body: |
            Auto-generated by the `update-module-diagram` job after a change on `main` altered the
            Spring Modulith module boundaries (`ModularityTest.createModuleDocumentation()`).
          branch: docs/update-module-diagram
          delete-branch: true
  lint:
    uses: ./.github/workflows/subflow_lint.yml
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, test, version, sonar, e2e-test]
    with:
      imageTags: ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      scanImage: true
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  deploy-test:
    uses: ./.github/workflows/subflow_deploy.yml
    # main is the "must be green" pipeline: unlike PRs, deployment requires
    # backend+frontend unit tests AND e2e to have passed, not just a
    # successful build
    needs: [build-push-image, test, e2e-test, version]
    with:
      environment: test
      version: ${{ needs.version.outputs.version }}
    concurrency:
      group: test-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
