name: Main Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Gates every job below on what the pushed commits actually touch - a docs-only merge builds no
  # image and deploys nothing, since the running test environment is already up to date. See
  # subflow_changes.yml for the classification rules.
  changes:
    uses: ./.github/workflows/subflow_changes.yml
  build:
    # Both artifacts are built whenever the application changed at all: the image and the e2e run
    # need the jar and the frontend bundle together, no matter which of the two was edited.
    uses: ./.github/workflows/subflow_build.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
  test:
    uses: ./.github/workflows/subflow_test.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
  sonar:
    # A leaf: nothing waits for this. It needs `test` only because it consumes the jacoco report that
    # job uploads - it reports, and with `sonar.qualitygate.wait: false` (see build.gradle.kts) it
    # cannot even fail on the gate's verdict, so the only thing gating anything on it would buy is a
    # SonarCloud outage blocking a deploy.
    uses: ./.github/workflows/subflow_sonar.yml
    needs: test
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    uses: ./.github/workflows/subflow_lint.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      docker: ${{ needs.changes.outputs.docker == 'true' }}
  codeql:
    uses: ./.github/workflows/subflow_codeql.yml
    needs: changes
    if: needs.changes.outputs.app == 'true'
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
  # sonar, build-push-image, e2e-test and the deploy jobs need no gate of their own: they depend on
  # build/test, and GitHub skips a job whose dependency was skipped.
  build-push-image:
    uses: ./.github/workflows/subflow_docker_image.yml
    needs: [build, test, e2e-test]
    with:
      # the mutable "dev"/"test" tags always point at the most recently built candidate for that
      # environment, which is what cleanup.yml keys off to protect it regardless of how many newer
      # commit-SHA-tagged PR images have since piled up (#3631)
      imageTags: |
        ${{ github.sha }}
        test
        dev
      version: ${{ github.sha }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  scan-image:
    # Deliberately not a dependency of the deploy jobs below - the image is already built and pushed
    # at this point, and a vulnerability report is a signal to act on rather than a reason to hold a
    # merged change back from dev/test. It therefore runs alongside them, not in front of them.
    uses: ./.github/workflows/subflow_image_scan.yml
    needs: build-push-image
    with:
      imageRef: ${{ needs.build-push-image.outputs.imageRef }}
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  e2e-test:
    uses: ./.github/workflows/subflow_e2e_test.yml
    needs: build
  lighthouse:
    # This pipeline and the release one are the only two that rate the frontend - a pull request does
    # not, see ADR-0055. Gated on the frontend having changed, since only that can move these
    # numbers. Deliberately not a dependency of deploy-test below - a page-performance threshold is a
    # signal to act on, not a reason to hold a merged change back from the test environment.
    uses: ./.github/workflows/subflow_lighthouse.yml
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true'
  deploy-test:
    uses: ./.github/workflows/subflow_deploy.yml
    # main is the "must be green" pipeline: unlike PRs, deployment requires
    # backend+frontend unit tests AND e2e to have passed, not just a
    # successful build
    needs: [build-push-image, test, e2e-test]
    with:
      environment: test
      # The shortened SHA the image was actually tagged with, resolved by the build workflow.
      version: ${{ needs.build-push-image.outputs.version }}
    concurrency:
      group: test-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
  deploy-dev:
    # Same build and the same gates as deploy-test above: dev follows main so the two environments
    # run what was merged, and a pull-request deploy to dev is only ever a temporary detour from it.
    uses: ./.github/workflows/subflow_deploy.yml
    needs: [build-push-image, test, e2e-test]
    with:
      environment: dev
      # The shortened SHA the image was actually tagged with, resolved by the build workflow.
      version: ${{ needs.build-push-image.outputs.version }}
    concurrency:
      group: dev-environment
    secrets:
      sshKey: ${{ secrets.SSH_PRIVATE_KEY }}
      sshKnownHosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      sshDeployCommand: ${{ secrets.SSH_DEPLOY_COMMAND }}
