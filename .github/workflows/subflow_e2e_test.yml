name: E2E Test

# Sharded so the suite runs in parallel rather than end to end - the same approach as the
# lighthouse workflow's `pages` job. Each shard starts its own backend/database and only ever runs
# its own spec files, so shards can't interfere with each other's state. The specs are grouped by
# feature area into roughly equal-sized shards by file count (no per-spec timing data exists to
# balance by); if the job summaries show one shard consistently slower than the others, move a spec
# or two across shards to rebalance. Adding a spec file means adding it to exactly one shard here -
# nothing derives the list automatically.

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:

jobs:
  run:
    name: run (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      # One shard failing says nothing about the others, and a run that stops at the first red
      # shard reports only a fraction of what it covered.
      fail-fast: false
      matrix:
        shard:
          - name: kunden
            specs:
              - customer-above-limit.cy.ts
              - customer-create.cy.ts
              - customer-detail.cy.ts
              - customer-duplicates.cy.ts
              - customer-edit.cy.ts
              - customer-overview.cy.ts
              - customer-quickcheck.cy.ts
              - customer-search.cy.ts
              - quick-open.cy.ts
          - name: einstellungen
            specs:
              - settings-cars.cy.ts
              - settings-employees.cy.ts
              - settings-food-categories.cy.ts
              - settings-food-return-categories.cy.ts
              - settings-mail.cy.ts
              - settings-routes.cy.ts
              - settings-shelters.cy.ts
              - settings-shops.cy.ts
              - settings-static-values.cy.ts
          - name: benutzer-anmeldung
            specs:
              - user-create.cy.ts
              - user-detail.cy.ts
              - user-edit.cy.ts
              - user-login-attempts.cy.ts
              - user-search.cy.ts
              - login.cy.ts
              - logout.cy.ts
              - passwordchange.cy.ts
              - audit-log.cy.ts
              - data-subject-request.cy.ts
              - general.cy.ts
          - name: betrieb
            specs:
              - checkin.cy.ts
              - dashboard.cy.ts
              - food-collection-recording.cy.ts
              - push-notifications.cy.ts
              - route-guidance.cy.ts
              - scanner.cy.ts
              - statistics-children.cy.ts
              - statistics-general.cy.ts
              - support-request.cy.ts
              - ticket-screen.cy.ts
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: tafeladmin
          POSTGRES_PASSWORD: tafeladmin
          POSTGRES_DB: tafeladmin
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/src/main/webapp/package-lock.json'
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: admin-jarfile
          path: ./artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: ./static
      - run: npm ci --ignore-scripts
        working-directory: frontend/src/main/webapp
      - name: Install cypress binary
        run: node_modules/.bin/cypress install
        working-directory: frontend/src/main/webapp
      - name: Run cypress
        run: |
          java -Dspring.profiles.active=e2e -jar ./artifact/admin-backend.jar &
          cd frontend/src/main/webapp

          specs=""
          for f in ${{ join(matrix.shard.specs, ' ') }}; do
            specs="${specs}cypress/e2e/${f},"
          done

          npm run cy:run-ci -- --spec "${specs%,}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cypress-results-${{ matrix.shard.name }}
          path: |
            ./frontend/src/main/webapp/cypress/screenshots/
            ./frontend/src/main/webapp/cypress/videos/
          retention-days: 1
