name: E2E Test

# Every spec file gets its own shard, so the suite runs with full parallelism instead of grouping
# several files per runner. The spec list is discovered from cypress/e2e/ at run time rather than
# hand-maintained (unlike the lighthouse workflow's route shards, which can't be derived from files
# since a route doesn't map 1:1 onto one) - adding a spec file needs no change here. Each shard
# starts its own backend/database and only ever runs its own spec file, so shards can't interfere
# with each other's state.

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'corretto'

on:
  workflow_dispatch:
  workflow_call:

jobs:
  discover-specs:
    name: discover specs
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        working-directory: frontend/src/main/webapp/cypress/e2e
        run: |
          specs=$(ls *.cy.ts | sed 's/\.cy\.ts$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "specs=${specs}" >> "$GITHUB_OUTPUT"

  run:
    name: run (${{ matrix.spec }})
    needs: discover-specs
    runs-on: ubuntu-latest
    strategy:
      # One spec failing says nothing about the others, and a run that stops at the first red
      # shard reports only a fraction of what it covered.
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.discover-specs.outputs.specs) }}
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: tafeladmin
          POSTGRES_PASSWORD: tafeladmin
          POSTGRES_DB: tafeladmin
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'frontend/src/main/webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/src/main/webapp/package-lock.json'
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: admin-jarfile
          path: ./artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: ./static
      - run: npm ci --ignore-scripts
        working-directory: frontend/src/main/webapp
      # setup-node's `cache: npm` covers ~/.npm, but the Cypress binary is not an npm package - it
      # lives in its own cache and is normally fetched by a postinstall script that `npm ci
      # --ignore-scripts` deliberately skips (ADR-0019). Without this, every shard re-downloads the
      # same ~200 MB binary, which with one shard per spec file means paying for it dozens of times
      # per run. Keyed on the lockfile, which is what pins the Cypress version.
      - name: Cache the cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/src/main/webapp/package-lock.json') }}
      - name: Install cypress binary
        # A no-op on a cache hit ("Cypress ... is installed"), the download on a miss.
        run: node_modules/.bin/cypress install
        working-directory: frontend/src/main/webapp
      - name: Run cypress
        run: |
          java -Dspring.profiles.active=e2e -jar ./artifact/admin-backend.jar &
          cd frontend/src/main/webapp
          npm run cy:run-ci -- --spec "cypress/e2e/${{ matrix.spec }}.cy.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cypress-results-${{ matrix.spec }}
          path: |
            ./frontend/src/main/webapp/cypress/screenshots/
            ./frontend/src/main/webapp/cypress/videos/
          retention-days: 1
