[versions]
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
# Release train "Oakwood" - the first line compatible with Spring Boot 4.1. Only spring-cloud-context
# is used from it (see backend/build.gradle.kts), not the config server/client or the bus.
spring-cloud = "2025.1.3"
jackson = "3.2.2"
# Legacy Jackson 2.x line, pulled in transitively (jjwt-jackson, swagger-core-jakarta) alongside the Jackson 3.x
# used directly by this project. Pinned separately to patch known CVEs in that transitive line.
jackson-legacy = "2.22.2"
jjwt = "0.13.0"
postgresql = "42.7.13"
bouncycastle = "1.85.2"
apache-fop = "2.11"
qrcode-kotlin = "4.5.0"
passay = "2.0.0"
bucket4j = "8.19.0"
apache-commons-csv = "1.14.1"
apache-commons-lang3 = "3.20.0"
springdoc-openapi = "3.1.0"
spring-retry = "2.0.13"
# Runs the scheduled jobs that are not row-based once per cluster. Stores its lock in the same
# PostgreSQL as everything else (ADR-0003) - a library, not another piece of infrastructure.
shedlock = "7.9.0"

# Test dependency versions
archunit = "1.5.0"
mockk = "1.14.11"
testcontainers = "2.0.5"
apache-pdfbox = "3.0.8"
image-comparison = "4.4.0"
awaitility = "4.3.0"

# Plugin versions
sonarqube = "7.4.0.8496"
ktlint-gradle = "14.2.0"

[libraries]
# Kotlin
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Spring Boot starters
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# Spring Modulith
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }

# Spring Cloud
spring-cloud-context = { module = "org.springframework.cloud:spring-cloud-context" }

# Spring Security
spring-security-messaging = { module = "org.springframework.security:spring-security-messaging" }

# Spring Retry
spring-retry = { module = "org.springframework.retry:spring-retry", version.ref = "spring-retry" }

# ShedLock
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

# Flyway
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# Micrometer
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Jackson
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-dataformat-xml = { module = "tools.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-databind-legacy = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-legacy" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Crypto - required by Spring Security's Argon2PasswordEncoder, which uses BouncyCastle's classes
# directly rather than through a registered JCE provider (see config.WebSecurityConfig).
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# PDF / QR
apache-fop = { module = "org.apache.xmlgraphics:fop", version.ref = "apache-fop" }
qrcode-kotlin-jvm = { module = "io.github.g0dkar:qrcode-kotlin-jvm", version.ref = "qrcode-kotlin" }

# Utilities
passay = { module = "org.passay:passay", version.ref = "passay" }
# In-memory token-bucket rate limiting (RateLimiterIpService) - _jdk17, matching this project's JDK
# 26 toolchain being well above the artifact's JDK 17 baseline.
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
apache-commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "apache-commons-csv" }
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apache-commons-lang3" }

# API documentation
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

# Test dependencies
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
mockk-jvm = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
apache-pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "apache-pdfbox" }
image-comparison = { module = "com.github.romankh3:image-comparison", version.ref = "image-comparison" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# BOMs
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
