server.port: 0 # Random port for each SpringBootTest

spring:
  datasource:
    driverClassName: org.postgresql.Driver
  flyway:
    locations: classpath:/db-migration
    group: true
    ignore-migration-patterns: "*:missing"
    baseline-on-migrate: true
    clean-disabled: false
  jpa:
    open-in-view: false

tafeladmin:
  setup:
    initialAdmin:
      # Integration tests share one schema across classes and start it empty, so the first-run
      # bootstrap would insert a user and change what the user-search tests see. Its behaviour is
      # covered by InitialAdminUserServiceTest and InitialAdminUserServiceIT, which brings a
      # container and a context of its own for exactly that empty state.
      enabled: false

security:
  jwtToken:
    issuer: test-issuer
    audience: test-audience
    secret:
      # HMACSHA256 requires a key of at least 256 bits (32 bytes) - anything shorter throws
      # io.jsonwebtoken.security.UnsupportedKeyException the moment a test actually signs a token
      # with the real JwtTokenService bean (e.g. UserControllerEscalationIT's self-service password
      # change, issue #3572), rather than only stubbing it away with a relaxed mock.
      value: integration-test-secret-value-padded-to-32-bytes-minimum
      algorithm: HMACSHA256
    expirationTimeInSeconds: 300 # 5 minutes
    expirationTimePwdChangeInSeconds: 600 # 10 minutes
