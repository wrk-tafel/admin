tafeladmin:
  # Set so the login page's environment badge has something to show - it's the one screen that
  # reads config before logging in, and only a real run proves that endpoint is reachable anonymously.
  environmentLabel: E2E
  testdata:
    enabled: true
  support:
    # Only makes the support endpoint answer "configured" - no mail server is set up for the e2e
    # run, so the send itself is skipped (see MailSenderService) and nothing is delivered anywhere.
    recipients:
      - "support@e2e-test"
  storage:
    # Written to by the Cypress e2e run via a Node fs task (see cypress.config.ts) - java.io.tmpdir
    # and Node's os.tmpdir() resolve to the same OS temp directory on the runner both processes
    # share, unlike user.dir which differs between a local bootRun and CI's `java -jar`.
    scannerPath: ${java.io.tmpdir}/tafeladmin-e2e-scanner-inbox
  configReload:
    # Shortened from the 5s default so the e2e run doesn't have to sit out a production-sized poll
    # interval to see a config edit take effect (see ConfigFileReloadService).
    cron: "* * * * * *"

spring:
  # The file the Cypress run edits to prove config hot-reload end to end - optional because it only
  # exists while a spec is exercising it, and in the same shared temp directory as the scanner inbox
  # above for the same reason.
  config:
    import: optional:file:${java.io.tmpdir}/tafeladmin-e2e-config.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/tafeladmin
    username: tafeladmin
    password: tafeladmin
  flyway.locations: classpath:/db-migration,classpath:/db-migration-testdata
  # testdata setup wipes and re-creates the schema on startup (see FlywayConfig)
  flyway.clean-disabled: false

security:
  jwtToken:
    issuer: http://e2e-test
    audience: wrk-tafel-e2e
    secret.value: e2e-test-only-not-a-real-secret-do-not-use-in-production-00000000000000000000000000000000000000
  # Several specs deliberately fire 10+ /api/login requests back to back from the runner's own IP to
  # trigger loginAttempts' username lockout (see login.cy.ts, user-search.cy.ts) - the production
  # default would trip on that burst well before the lockout under test does. RateLimitFilter itself
  # is still wired in and gets its own IT coverage; this only raises the ceiling so it stays out of
  # the way of an unrelated feature's e2e run.
  rateLimit:
    capacity: 1000
    refillTokens: 1000
  # The same shard's specs cumulatively cause well over a dozen genuine bad-credential failures from
  # the runner's own IP (the two 10-failure username-lockout bursts above, plus a handful of one-off
  # wrong-password checks) - comfortably under the production default on its own, but close enough
  # that one more added test could tip it into flaky IP lockouts unrelated to what that test covers.
  loginAttemptsIp:
    maxFailures: 1000
