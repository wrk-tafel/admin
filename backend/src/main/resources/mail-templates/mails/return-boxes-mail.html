<div th:fragment="content">
    <p>Infos zur Ausgabe vom [[ ${distributionDate} ]].</p>
    <div class="tafel-section-title">Anmerkungen</div>
    <!--/* [[...]] escapes: notes is a free-text textarea, so it must not be able to bring markup
           with it. white-space: pre-wrap on .tafel-note keeps the typed line breaks without
           turning them into <br/>. route/shop names and the return-box description are also
           user-entered, so they escape the same way. */-->
    <div th:if="${notes}" class="tafel-note">[[ ${notes} ]]</div>
    <p th:unless="${notes}" class="tafel-empty">Keine</p>

    <div class="tafel-section-title">Retourkisten</div>
    <div th:if="${!#lists.isEmpty(returnBoxes.routes)}">
        <div th:each="route : ${returnBoxes.routes}" style="margin-bottom: 16px;">
            <div style="font-weight: bold; margin-bottom: 6px;">[[ ${route.name} ]]</div>
            <table role="presentation" class="tafel-table" cellpadding="0" cellspacing="0" border="0">
                <tr th:each="shop : ${route.shops}">
                    <td>
                        <strong>[[ ${shop.name} ]]</strong><br/>
                        <span style="color: #6B6B6B;">[[ ${shop.address} ]]</span>
                    </td>
                    <td>[[ ${shop.returnBoxes} ]]</td>
                </tr>
            </table>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(returnBoxes.routes)}" class="tafel-empty">Keine</p>
</div>
