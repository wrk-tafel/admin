server:
    shutdown: immediate

logging:
  level:
    root: INFO
    org.apache: INFO
    org.springframework.security: INFO

spring:
  web:
    error:
      include-stacktrace: always
  datasource:
    url: jdbc:postgresql://localhost:5432/tafeladmin
    username: tafeladmin
    password: tafeladmin
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

security:
  jwtToken:
    issuer: http://localhost
    audience: wrk-tafel
    secret.value: 8a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe7585012
    expirationTimeInSeconds: 604800 # 1 week for local development

tafeladmin:
  mail:
    from: "dummy@localhost"
    defaultRecipientsBcc:
      - "bcc1@localhost"
  support:
    # Set a GitHub personal access token (Issues: Read and write) here locally to test the support
    # contact feature end-to-end; leave unset otherwise (the endpoint fails with a clear error).
    githubToken: ~
    titlePrefix: "[LOCAL]"
  storage:
    documentsPath: ${user.dir}/documents
    # Drop a file here manually to test the "scanner folder" document picker locally.
    scannerPath: ${user.dir}/scanner-inbox

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true
