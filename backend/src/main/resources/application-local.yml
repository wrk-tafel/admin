server:
    shutdown: immediate

logging:
  level:
    root: INFO
    org.apache: INFO
    org.springframework.security: INFO

spring:
  web:
    error:
      include-stacktrace: always
  datasource:
    url: jdbc:postgresql://localhost:5432/tafeladmin
    username: tafeladmin
    password: tafeladmin
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

security:
  jwtToken:
    issuer: http://localhost
    audience: wrk-tafel
    secret.value: 8a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe758502948917ae98709b7cc502e4c7a0d3bc9d183b5be24378a58255b49728fe7585012
    expirationTimeInSeconds: 604800 # 1 week for local development

tafeladmin:
  environmentLabel: "LOCAL"
  mail:
    from: "dummy@localhost"
    defaultRecipientsBcc:
      - "bcc1@localhost"
  support:
    # Where the in-app support form sends to. Locally that is Mailpit (docker-compose.yml), so the
    # mail can be read at http://localhost:8025 without anything leaving the machine.
    recipients:
      - "support@localhost"
    subjectPrefix: "[SUPPORT]"
  features:
    # Set to false to switch the scanner folder off without unsetting scannerPath below - the
    # "Scanner" document source then disappears from the UI and the folder is no longer polled.
    scannerFolderEnabled: true
  storage:
    # Relative paths resolve against the backend process's working directory (the "backend" module
    # folder when started via `./gradlew :backend:bootRun`), so these stay inside the repo - both
    # are gitignored (see .gitignore).
    documentsPath: documents
    # Drop a file here manually to test the "scanner folder" document picker locally. Whether the
    # feature is offered at all is tafeladmin.features.scannerFolderEnabled above.
    scannerPath: scanner-inbox
  push:
    # Set a VAPID keypair here to test push notifications locally - see
    # TafelAdminPushProperties.vapidPublicKey/vapidPrivateKey for the exact openssl commands to
    # generate and correctly extract one (the raw key bytes, NOT a base64'd PEM file). Leave
    # unset otherwise (the endpoint fails with a clear error).
    vapidPublicKey: ~
    vapidPrivateKey: ~
    vapidSubject: ~

springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true
