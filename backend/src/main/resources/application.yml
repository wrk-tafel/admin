logging:
  level:
    root: INFO
    org.apache: WARN

management:
  server:
    port: 8081
  endpoints.web.exposure.include: prometheus,health

server:
  port: 8080
  # trust X-Forwarded-* headers from the reverse proxy, so request.isSecure is true behind TLS
  # termination and the JWT cookie is issued with the Secure flag
  forward-headers-strategy: framework
  servlet:
    session.cookie.path: ${tafeladmin.server.relativeBaseUrl}
  error:
    include-message: always
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      buffered: false
      prefix: access
      suffix: .log
      rotate: false

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
  flyway:
    locations: classpath:/db-migration
    group: true
    ignore-migration-patterns: "*:missing"
    baseline-on-migrate: true
    # flyway.clean() drops the whole schema - only the testdata/e2e profiles may re-enable it
    clean-disabled: true
  mail:
    properties.mail.smtp:
      auth: true
      starttls.enable: true
  jpa:
    properties:
      hibernate:
        id:
          db_structure_naming_strategy: single # TODO migrate to new default strategy (sequence per table)
    open-in-view: false
  thymeleaf:
    prefix: classpath:/mail-templates/
  mvc:
    async:
      request-timeout: 3600000 # 1 hour

security:
  jwtToken:
    secret.algorithm: HMACSHA256
    expirationTimeInSeconds: 36000 # 10 hours
    expirationTimePwdChangeInSeconds: 300 # 5 minutes
  loginAttempts:
    maxFailures: 5
    lockoutDurationInSeconds: 900 # 15 minutes

tafeladmin:
  server:
    relativeBaseUrl: /
