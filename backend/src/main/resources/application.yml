# Defaults for every environment, and the reference for what can be configured at all.
#
# Anything an operator may set is listed here, whether or not it has a default: the settings that
# depend on the deployment (database, mail server, JWT signing) or are secret (GitHub token, VAPID
# keys) appear as commented-out entries with the explanation of what they do. Commented rather than
# empty on purpose - this file is loaded for real, so a placeholder value would silently become the
# configuration. Uncommenting one here configures every environment; to configure a single one,
# copy the entry into that environment's own file instead.
#
# In production those per-deployment values come from an operator-managed config.yml bind-mounted
# into the container (`-Dspring.config.additional-location`, see _build/Dockerfile), which overrides
# what is set here. Locally they come from application-local.yml, and for the Cypress run from
# application-e2e.yml.
#
# Editing the mounted config.yml takes effect without a restart for most of `tafeladmin.*` - see
# tafeladmin.configReload below, and the per-setting notes for the ones that still need one.

logging:
  level:
    root: INFO
    org.apache: WARN
  file:
    name: ${user.dir}/logs/app.log
  # Spring Boot's own defaults (10MB per file, 7 files kept, no total cap) match what is set here -
  # made explicit so app.log's rollover is a decision rather than whatever the framework happens to
  # default to.
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  pattern:
    file: "%d{ISO8601} %-5level [%t] %C: %msg%n%throwable"

management:
  server:
    port: 8081
  endpoints.web.exposure.include: prometheus,health

server:
  port: 8080
  # trust X-Forwarded-* headers from the reverse proxy, so request.isSecure is true behind TLS
  # termination and the JWT cookie is issued with the Secure flag
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/manifest+json
  servlet:
    session.cookie.path: ${tafeladmin.server.relativeBaseUrl}
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      buffered: false
      prefix: access
      suffix: .log
      # Tomcat itself never rotates access.log - rotation/retention for it is handled host-side
      # (e.g. logrotate on the deployment host), outside this application's configuration.
      rotate: false

spring:
  web:
    error:
      include-message: always
      include-stacktrace: never
    resources:
      # frontend is built and deployed independently of the backend jar (see _build/Dockerfile);
      # this is where its static output is expected to be placed at runtime
      static-locations: file:${user.dir}/static/
  datasource:
    # Required, and deployment-specific - the application does not start without them. Note that
    # none of these three take effect on a config reload: the Hikari pool is built once at startup
    # (see ConfigFileReloadService), so moving the database needs a restart.
    # url: jdbc:postgresql://<host>:5432/tafeladmin
    # username: tafeladmin
    # password: <database password>
    driverClassName: org.postgresql.Driver
    hikari:
      # Sized for this application's real concurrency: a handful of simultaneous users plus the
      # @Async executor's 10 threads (see AsyncConfig). Postgres' default max_connections is 100,
      # so a pool much larger than this claims connections nobody uses - and every pool-wide event
      # (see keepalive-time below) costs one log line per connection.
      maximum-pool-size: 20
      # logs a warning with a stack trace for any connection held longer than this, so a leak
      # (e.g. a missed transaction boundary) surfaces well before the pool is exhausted
      leak-detection-threshold: 60000
      # A database restart invalidates every pooled connection at once. Without keepalive-time
      # nothing notices until the next real request, which then works its way through the whole
      # pool and logs a WARN per dead connection before it is served. With it, the housekeeper
      # probes idle connections in the background and evicts the dead ones at DEBUG instead.
      keepalive-time: 120000 # 2 minutes, must stay below max-lifetime
      # Retires pooled connections well before any infrastructure-side idle timeout can drop them
      # underneath us (HikariCP's own default is 30 minutes).
      max-lifetime: 600000 # 10 minutes
  flyway:
    locations: classpath:/db-migration
    group: true
    ignore-migration-patterns: "*:missing"
    baseline-on-migrate: true
    # flyway.clean() drops the whole schema - only the testdata/e2e profiles may re-enable it
    clean-disabled: true
  mail:
    # Deployment-specific. With no host set, Spring Boot creates no JavaMailSender at all and every
    # mail is dropped rather than queued (see MailOutboxService.enqueue) - which is exactly what a
    # dev environment wants, and never what production does. The addresses the mails go to are not
    # configured here but maintained in the UI under Einstellungen (mail_recipients);
    # tafeladmin.mail below only sets who they come from.
    # host: <smtp host>
    # port: 587
    # username: <smtp user>
    # password: <smtp password>
    properties.mail.smtp:
      auth: true
      starttls.enable: true
  jpa:
    open-in-view: false
  thymeleaf:
    prefix: classpath:/mail-templates/
  mvc:
    async:
      request-timeout: 3600000 # 1 hour
  # No spring.servlet.multipart limits here on purpose: they are derived from
  # tafeladmin.storage.maxDocumentSize below, with headroom, so the document limit is one number
  # rather than two that have to be kept in step (see MultipartConfig).

# None of this is reloadable, by design: ApplicationProperties is constructor-bound, so a config
# reload leaves it exactly as it was bound at startup. Rotating a signing secret or a token lifetime
# under a running application would invalidate sessions in flight at a moment nobody chose - and
# constructor binding is also what makes the application refuse to start when a value is missing,
# rather than fall back to a silent default. Every change here needs a restart.
security:
  jwtToken:
    # Required, and deployment-specific. issuer/audience identify this installation in the tokens it
    # signs; the secret is the signing key and must be a long random string kept out of this
    # repository (in production it comes from the mounted config.yml). Changing any of the three
    # invalidates every session that is currently logged in.
    # issuer: https://<public url of this installation>
    # audience: wrk-tafel
    # secret.value: <long random string>
    secret.algorithm: HMACSHA256
    expirationTimeInSeconds: 36000 # 10 hours
    expirationTimePwdChangeInSeconds: 300 # 5 minutes
  # After maxFailures failed logins an account is locked for lockoutDurationInSeconds. Entries older
  # than that window are cleaned up hourly, and an administrator can lift a lock early via
  # Benutzer -> Anmelde-Versuche (see LoginAttemptService).
  loginAttempts:
    maxFailures: 10
    lockoutDurationInSeconds: 300 # 5 minutes
  # Argon2id tuning for password hashes (WebSecurityConfig.passwordEncoder). A change here only
  # affects newly-created hashes; an existing user's hash is migrated onto it lazily, on their next
  # successful login, rather than needing a bulk rehash (see
  # TafelLoginProvider.additionalAuthenticationChecks). saltLength/hashLength are left at their
  # defaults (16/32 bytes) below since raising them invalidates nothing but also buys nothing here.
  argon2:
    memory: 131072 # KiB
    iterations: 3
    parallelism: 1

# Swagger UI/OpenAPI docs are only browsable on developer machines (see application-local.yml) -
# never exposed in production or e2e/testdata environments
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false

tafeladmin:
  # Overridden by the TAFELADMIN_VERSION/TAFELADMIN_BUILD_TIME env vars baked into the Docker
  # image at build time (see _build/Dockerfile and .github/workflows/subflow_docker_image.yml);
  # these defaults only apply to local/dev runs started outside that image.
  version: dev
  buildTime: unknown
  environmentLabel: ""
  # The audit trail (audit_log) - see ADR-0039. `enabled` and `retentionDays` are read per use and
  # therefore take effect on a running deployment; `cleanupCron` does not, because @Scheduled fixes
  # its expression when the bean is created (same as configReload.cron below), so changing it
  # needs a restart. 05:00 is the quiet window between the last late-evening work and the first
  # distribution-day activity, so the delete never lands while anyone is working; the
  # orphaned-document cleanup runs in the same slot and contends for nothing with it.
  #
  # retentionDays is kept short on purpose: the log holds names, addresses and income figures of
  # people whose household may since have been deleted, so it is bounded by what the trail is
  # actually used for - questioning a recent change - rather than by how long it might conceivably
  # be interesting. Raise it per deployment if a longer trail is genuinely needed; a value of 0 or
  # less keeps every entry instead of deleting them all.
  #
  # breachDetection.readThreshold - GDPR gap G11's threshold check (ExcessiveReadAccessDetectionService):
  # more than this many READ entries by one user within the trailing hour notifies administrators via
  # push. Read per use, so it can be tuned on a running deployment; 0 or less switches the check off.
  # breachDetectionCron - how often that check runs, default hourly - is startup-only for the same
  # reason cleanupCron is.
  #
  # readDedupeWindow - how long the same actor's READ of the same household is considered "already
  # recorded" (HouseholdService.findByHouseholdId), so reloading the customer detail screen doesn't
  # write a fresh entry every time. Read per use.
  #
  # cleanupEnabled - GDPR gap G18 - the deletion kill switch, independent of both `enabled` above
  # (which only ever gates writing) and retentionDays: before this existed, the only way to pause
  # deletion was retentionDays <= 0, indistinguishable from "no window configured yet". Read per use.
  #
  # maxDeletionsPerRun - the most a single cleanup run may delete before it refuses to proceed and
  # alerts administrators instead (RETENTION_RUN push notification). Higher than the other retention
  # jobs' ceilings below, since this table's daily churn is legitimately in the thousands. 0 or less
  # switches the ceiling off entirely.
  audit:
    enabled: true
    retentionDays: 30
    cleanupEnabled: true
    maxDeletionsPerRun: 20000
    cleanupCron: "0 0 5 * * *"
    readDedupeWindow: 5m
    breachDetection:
      readThreshold: 20
    breachDetectionCron: "0 0 * * * *"
  # Check-in via handheld scanners. A scanner refreshes its registration while it is in use, so this
  # only has to outlast the gaps within a distribution day: long enough that a scanner switched off
  # over lunch keeps its id, short enough that ids of devices put away for good are handed out again.
  # Read per use, so it can be widened while a distribution is running - a cleanup reclaiming ids
  # mid-distribution hands the scanners still in use new ones.
  checkin:
    scannerRegistrationRetention: 2d
  # The work that runs right after a distribution is closed - the statistics snapshot and the missing
  # cost contributions, in one transaction - is retried this often before it is given up on. Both
  # values are read per use, so an operator can give a close that is failing against a struggling
  # database more room without a restart.
  distribution:
    closeRetry:
      maxAttempts: 3
      backoff: 2s
  # Switches for optional features. Each one is a plain on/off an operator flips; how the feature is
  # wired up once it's on lives in its own section (e.g. storage.scannerPath for the scanner folder).
  features:
    scannerFolderEnabled: true
  # GDPR gap G1 (docs/architecture/gdpr-compliance.md) - deletes a household, and everything attached
  # to it (persons, notes, documents on disk, attendance history), once its validUntil has been in the
  # past for longer than retentionYears. Runs through the same HouseholdService.deleteHouseholdByHouseholdId
  # a staff member's manual delete uses, so there is only the one retention window rather than a
  # separate one per data class - see HouseholdRetentionService. `enabled` and `retentionYears` are
  # read per use and take effect on a running deployment; `cleanupCron` does not, for the same reason
  # as audit.cleanupCron above. 06:00 is a quiet slot after the audit/document-storage cleanups at
  # 05:00, so a night's deletions do not overlap with each other's transactions.
  #
  # retentionYears defaults to 7, the Austrian bookkeeping retention period (UGB/BAO Section 132) for
  # records touching cost contributions - a defensible floor, not a final answer; the actual period is
  # the operator's call. A value of 0 or less keeps every household instead of deleting them all.
  #
  # maxDeletionsPerRun - GDPR gap G18 - the most a single run may delete before it refuses to proceed
  # and alerts administrators instead (RETENTION_RUN push notification), so a misconfigured window
  # sweeping a database's worth of households doesn't look identical to a normal night. Read per use.
  # 0 or less switches the ceiling off entirely.
  householdDeletion:
    enabled: true
    retentionYears: 7
    maxDeletionsPerRun: 50
    cleanupCron: "0 0 6 * * *"
  # GDPR gap G13 (docs/architecture/gdpr-compliance.md), the "users" half - mirrors householdDeletion
  # above for staff accounts. Candidate accounts are measured by lastLogin (falling back to createdAt
  # for an account that has never logged in), regardless of enabled - see
  # TafelAdminUserRetentionProperties for why. An account holding ADMINISTRATOR is never a candidate,
  # full stop, regardless of enabled or age. Deletion goes through TafelUserDetailsManager.deleteUser,
  # the same method the manual DELETE /api/users/{userId} endpoint uses, which leaves the linked
  # employees row untouched - see employeeDeletion below. `enabled`/`retentionTime` are read per use;
  # `cleanupCron` is startup-only, for the same reason as householdDeletion.cleanupCron. 06:15 is a
  # quiet slot after householdDeletion at 06:00.
  #
  # retentionTime is a Period (y/m/w/d suffixes, e.g. "7y", "18m", "730d" - unlike a Duration, which
  # has no year/month unit at all) rather than a plain year count, so it can be expressed however an
  # operator actually thinks about it. Defaults to 7y - unified with householdDeletion.retentionYears
  # and employeeDeletion.retentionTime below as one consistent retention floor across the application,
  # even though it isn't itself tied to householdDeletion's bookkeeping period; widen or shorten per
  # deployment. A zero or negative period keeps every account instead of deleting them all.
  #
  # maxDeletionsPerRun - GDPR gap G18 - see householdDeletion.maxDeletionsPerRun above; same
  # reasoning, same ceiling default.
  userDeletion:
    enabled: true
    retentionTime: 7y
    maxDeletionsPerRun: 50
    cleanupCron: "0 15 6 * * *"
  # GDPR gap G13, the "employees" half - see userDeletion above. Deletes an employee once it is
  # referenced by nothing else at all - not just no linked user account, also no household issuer, no
  # household note author, no food collection driver/co-driver, no route stop completion recorder (see
  # EmployeeRepository.findExpiredEmployeeIdsSkipLocked for the full list) - and its row hasn't been
  # written to in longer than retentionTime, through the same EmployeeService.deleteEmployee a staff
  # member's manual delete uses. 06:30 runs after userDeletion (06:15) so an employee whose only
  # account is deleted the same night is already a candidate on the very next run.
  #
  # retentionTime defaults to 7y, the same unified floor as userDeletion.retentionTime and
  # householdDeletion.retentionYears, even though an employee this job ever reaches is by definition
  # not the issuer/driver/recorder of anything still on record, so no bookkeeping period specifically
  # applies to it. A zero or negative period keeps every employee instead of deleting them all.
  #
  # maxDeletionsPerRun - GDPR gap G18 - see householdDeletion.maxDeletionsPerRun above; same
  # reasoning, same ceiling default.
  employeeDeletion:
    enabled: true
    retentionTime: 7y
    maxDeletionsPerRun: 50
    cleanupCron: "0 30 6 * * *"
  # Watches the config files this application was started with - in production the operator-managed
  # /app/config/config.yml bind-mounted into the container - and re-binds tafeladmin.* whenever one
  # of them changes, so a setting can be flipped without restarting the container. See
  # ConfigFileReloadService for which values actually take effect live (the ones read per request)
  # and which still need a restart (the ones baked into a bean at startup). Setting `enabled: false`
  # reverts to binding the configuration once at startup and never again; it is read at startup
  # only, so switching it needs a restart either way.
  configReload:
    enabled: true
    # A cron, not an interval: every instance re-reads the file for itself, and firing on the
    # wall-clock boundary is what makes them pick a change up together rather than each on its own
    # boot-time phase. Read once at startup, like `enabled`.
    cron: "*/5 * * * * *"
  # Typo tolerance of the single search box on the customer and user search screens. See
  # TafelAdminSearchProperties - this is read per request, so it can be tuned against real data
  # without restarting the container.
  search:
    similarityThreshold: 0.5
  # First-run bootstrap of a new installation: while the users table is completely empty, one
  # administrator account is created at startup so the deployment can be logged into and configured
  # from the UI. As soon as any user exists this does nothing, whatever is configured here. Leave
  # the password unset and a random one is generated and printed to the log once; either way the
  # account must change it at first login. See InitialAdminUserService.
  setup:
    initialAdmin:
      enabled: true
      username: admin
      # password: <only for an unattended rollout that needs to know it up front>
      personnelNumber: "00001"
      firstname: Tafel
      lastname: Administrator
  # Where this installation is mounted below its origin. Dev/test/prod share one origin at different
  # path prefixes, so this is also what the JWT cookie's path and the PWA manifest are built from.
  # Baked into the security filter chain at startup - changing it needs a restart.
  server:
    relativeBaseUrl: /
  # The in-app support form mails the request, together with the technical context the browser
  # reports, to these addresses. Deployment-specific, so unset here - with no recipient the endpoint
  # fails with a clear error rather than pretending to have sent something. The mail goes out over
  # the spring.mail server above, from tafeladmin.mail.from, and carries tafeladmin.mail.subjectPrefix
  # so it is obvious which environment a request came from (e.g. "[TEST]"). subjectPrefix below goes
  # in front of the title the user typed and marks the mail as a support request rather than one of
  # the automated ones - a subject then reads "[TEST] Support: Scanner reagiert nicht".
  support:
    subjectPrefix: "Support:"
    # recipients:
    #   - support@<domain>
  # Who the automated mails (daily report, statistics, return boxes) come from. The recipients are
  # not configured here - they are maintained in the UI under Einstellungen. Only used when a mail
  # server is configured above; `from` is required as soon as one is.
  #
  # A mail is written to the mail_outbox table inside the transaction that produced it and handed to
  # the mail server by a poller afterwards (MailOutboxService). How often that poller looks is
  # tafeladmin.mailOutbox.interval below - read at startup only, for the same reason as
  # tafeladmin.configReload.cron.
  # mail:
  #   from: no-reply@<domain>
  #   subjectPrefix: "[TEST]"
  #   defaultRecipientsBcc:
  #     - archive@<domain>
  # Kept out of tafeladmin.mail above on purpose: that section is bound to a properties object, and
  # a key underneath it would make the section exist in every environment (see TafelAdminProperties).
  mailOutbox:
    # How often the poller looks for mails to send, and how often the queue is cleared of the mails
    # it no longer has to keep. Both are read at startup only, for the same reason as
    # tafeladmin.configReload.cron; everything below them is re-read per use, so retries can be
    # slowed down or a backlog drained faster on a running deployment - which is what you want during
    # a mail server incident, not a restart.
    interval: 10s
    cleanupInterval: 1h
    # Delivery attempts before a mail is parked as FAILED and reported as a push notification to
    # administrators. With the backoff below, five attempts span roughly half an hour.
    maxAttempts: 5
    # Waited after the first failed attempt, multiplied by the attempt count after that, capped at
    # maxRetryBackoff so a long outage still gets a regular retry.
    retryBackoff: 5m
    maxRetryBackoff: 30m
    # How long a sent mail's row is kept before it is deleted. It holds the finished message,
    # attachments and all, so this is the span in which somebody still asks "did the report go out on
    # Saturday?" - not an archive.
    sentRetention: 14d
    # The same for a mail that was given up on, counted from when it was queued. Longer, because it
    # is the only record that somebody never got their mail and that question comes late - but not
    # unlimited, because the row keeps the whole message including report PDFs and support
    # screenshots.
    failedRetention: 30d
  # Web Push (VAPID). Without a keypair the application runs normally and push notifications are
  # simply unavailable. Both keys must be the RAW key material, base64url-encoded - NOT the base64
  # inside a PEM file, which wraps DER/ASN.1 structure around the raw bytes and fails to decode; see
  # TafelAdminPushProperties for the exact openssl commands. vapidSubject is the contact address
  # browser push services may use to reach the sender (RFC 8292), a mailto: URI or an https: URL.
  # Read once when the push service is built, so changing any of them needs a restart.
  # push:
  #   vapidPublicKey: <65 raw bytes, base64url>
  #   vapidPrivateKey: <32 raw bytes, base64url>
  #   vapidSubject: mailto:<contact address>
  # How a push message asks the browser's push service to deliver it. Kept out of tafeladmin.push
  # above for the same reason mailOutbox sits next to mail: that section holds key material and is
  # absent unless a deployment configures it, and a default underneath it would make it exist
  # everywhere. Both are read per send.
  #
  # ttl is how long the push service may hold a message for a device that is currently offline -
  # roughly a distribution day, so a phone out of signal for a few hours still hears about the
  # distribution the notification is about, without it resurfacing the next day. urgency is the
  # RFC 8030 header: at anything below "high" FCM defers the message to the next maintenance window
  # while the device is in Doze, which for an "Ausgabe gestartet" alert means it arrives too late to
  # matter.
  pushDelivery:
    ttl: 12h
    urgency: high
  # The event streams the frontend keeps open, and the sse_outbox rows behind them. All three are
  # read per use, so a stream opened afterwards picks the new values up without a restart - streams
  # already open keep what they were created with. timeout spans a whole distribution day so a
  # dashboard doesn't reconnect during it; reconnectTime is what the browser waits before coming
  # back, kept short so a deploy is invisible to whoever is looking at the screen. Only the first few
  # minutes of outboxRetention are ever read (a reconnect replays at most that much, see
  # SseOutboxListenerService.REPLAY_MAX_AGE) - the rest is how long a published event can still be
  # looked up, against a table that grows with every dashboard update.
  sse:
    timeout: 12h
    reconnectTime: 1s
    outboxRetention: 14d
  storage:
    # Where uploaded customer documents are kept. A relative path resolves against the process's
    # working directory; in the container this is a mounted volume, since the files must outlive it.
    documentsPath: documents
    # Mount point of a NAS share a physical document scanner writes to, offered as a second document
    # source on a customer's documents tab. Not every installation has one - left unset, the feature
    # is off regardless of features.scannerFolderEnabled above. Polled once a second while on.
    # scannerPath: /mnt/scanner-inbox
    # The largest document that may be attached to a household, and the only place that size is set:
    # the servlet container's own multipart ceiling is derived from it with a fixed headroom (see
    # MultipartConfig), so an oversized upload is answered by HouseholdDocumentService with a
    # readable message instead of being refused while the request is still being parsed. The check
    # re-reads this per upload, so lowering the limit needs no restart; raising it past the ceiling
    # the container was built with does.
    maxDocumentSize: 25MB
    # How long a file in the documents folder that no database row points at is left alone before the
    # nightly cleanup deletes it. A file is written to disk before its row is committed, so this is
    # what keeps the cleanup from deleting a document out from under the request creating it.
    orphanedFileMinAge: 60m
  # Wipes and re-creates the schema on startup so the testdata migrations can seed it from scratch.
  # Only ever true for local development and the Cypress run - it destroys all data. Read once at
  # startup by definition, since Flyway has finished long before anyone could edit the config file.
  testdata:
    enabled: false
