# German messages for Passay's rule violations, loaded by TafelPasswordValidator's MessageResolver.
# Every rule TafelAdminPasswordProperties can switch on has its message here, so a rule an operator
# enables cannot reject a password without telling the user what was wrong with it.
#
# The keys are Passay's error codes and the positional arguments are its rule-result parameters, in
# the order the rule puts them in - see the library's own passay.properties for the originals. Keys
# suffixed with a match behaviour (.CONTAINS/.STARTS_WITH/.ENDS_WITH) are looked up first and exist
# so the German sentence can name the position itself instead of interpolating Passay's English
# description of it.
#
# Rules that need stored password history (HISTORY_VIOLATION, SOURCE_VIOLATION and the digest
# variants) are not configurable in this application and so are not listed - see
# TafelAdminPasswordProperties.

# LengthRule: 1=minimum, 2=maximum
TOO_SHORT=Das Passwort muss mindestens %1$s Zeichen lang sein.
TOO_LONG=Das Passwort darf höchstens %2$s Zeichen lang sein.

# CharacterRule: 1=required number of characters
INSUFFICIENT_LOWERCASE=Das Passwort muss mindestens %1$s Kleinbuchstaben enthalten.
INSUFFICIENT_UPPERCASE=Das Passwort muss mindestens %1$s Großbuchstaben enthalten.
INSUFFICIENT_ALPHABETICAL=Das Passwort muss mindestens %1$s Buchstaben enthalten.
INSUFFICIENT_DIGIT=Das Passwort muss mindestens %1$s Ziffern enthalten.
INSUFFICIENT_SPECIAL=Das Passwort muss mindestens %1$s Sonderzeichen enthalten.
INSUFFICIENT_SPECIAL_ASCII=Das Passwort muss mindestens %1$s Sonderzeichen enthalten.
INSUFFICIENT_SPECIAL_LATIN=Das Passwort muss mindestens %1$s Sonderzeichen enthalten.
INSUFFICIENT_SPECIAL_UNICODE=Das Passwort muss mindestens %1$s Sonderzeichen enthalten.

# CharacterCharacteristicsRule: 1=satisfied, 2=required, 3=available
INSUFFICIENT_CHARACTERISTICS=Das Passwort erfüllt %1$s von %3$s Zeichenarten, erforderlich sind %2$s.

# UsernameRule: 1=username
ILLEGAL_USERNAME=Der Benutzername darf nicht Teil des Passworts sein.
ILLEGAL_USERNAME.CONTAINS=Der Benutzername darf nicht Teil des Passworts sein.
ILLEGAL_USERNAME.STARTS_WITH=Das Passwort darf nicht mit dem Benutzernamen beginnen.
ILLEGAL_USERNAME.ENDS_WITH=Das Passwort darf nicht mit dem Benutzernamen enden.
ILLEGAL_USERNAME_REVERSED=Der Benutzername darf auch rückwärts nicht Teil des Passworts sein.
ILLEGAL_USERNAME_REVERSED.CONTAINS=Der Benutzername darf auch rückwärts nicht Teil des Passworts sein.
ILLEGAL_USERNAME_REVERSED.STARTS_WITH=Das Passwort darf nicht mit dem rückwärts geschriebenen Benutzernamen beginnen.
ILLEGAL_USERNAME_REVERSED.ENDS_WITH=Das Passwort darf nicht mit dem rückwärts geschriebenen Benutzernamen enden.

# WhitespaceRule
ILLEGAL_WHITESPACE=Leerzeichen sind nicht erlaubt.
ILLEGAL_WHITESPACE.CONTAINS=Leerzeichen sind nicht erlaubt.
ILLEGAL_WHITESPACE.STARTS_WITH=Das Passwort darf nicht mit einem Leerzeichen beginnen.
ILLEGAL_WHITESPACE.ENDS_WITH=Das Passwort darf nicht mit einem Leerzeichen enden.

# DictionarySubstringRule/DictionaryRule: 1=matching word
ILLEGAL_WORD=Folgendes Wort darf nicht enthalten sein: %1$s
ILLEGAL_WORD_REVERSED=Folgendes Wort darf auch rückwärts nicht enthalten sein: %1$s

# IllegalSequenceRule: 1=matching sequence
ILLEGAL_ALPHABETICAL_SEQUENCE=Das Passwort enthält die Buchstabenfolge '%1$s'.
ILLEGAL_NUMERICAL_SEQUENCE=Das Passwort enthält die Zahlenfolge '%1$s'.
ILLEGAL_QWERTY_SEQUENCE=Das Passwort enthält die Tastaturfolge '%1$s'.

# RepeatCharactersRule: 1=sequence length, 2=allowed sequences, 3=found sequences, 4=matches
ILLEGAL_REPEATED_CHARS=Das Passwort enthält %3$s Folgen von %1$s oder mehr gleichen Zeichen, erlaubt sind %2$s.

# CharacterOccurrencesRule: 1=character, 2=occurrences, 3=maximum
TOO_MANY_OCCURRENCES=Das Zeichen '%1$s' kommt %2$s mal vor, erlaubt sind höchstens %3$s.

# AllowedCharacterRule/IllegalCharacterRule: 1=character
ALLOWED_CHAR=Das Zeichen '%1$s' ist nicht erlaubt.
ALLOWED_CHAR.CONTAINS=Das Zeichen '%1$s' ist nicht erlaubt.
ALLOWED_CHAR.STARTS_WITH=Das Passwort darf nicht mit dem Zeichen '%1$s' beginnen.
ALLOWED_CHAR.ENDS_WITH=Das Passwort darf nicht mit dem Zeichen '%1$s' enden.
ILLEGAL_CHAR=Das Zeichen '%1$s' ist nicht erlaubt.
ILLEGAL_CHAR.CONTAINS=Das Zeichen '%1$s' ist nicht erlaubt.
ILLEGAL_CHAR.STARTS_WITH=Das Passwort darf nicht mit dem Zeichen '%1$s' beginnen.
ILLEGAL_CHAR.ENDS_WITH=Das Passwort darf nicht mit dem Zeichen '%1$s' enden.

# AllowedRegexRule/IllegalRegexRule: ALLOWED_MATCH 1=pattern, ILLEGAL_MATCH 1=match, 2=pattern
ALLOWED_MATCH=Das Passwort entspricht nicht dem geforderten Muster '%1$s'.
ILLEGAL_MATCH=Das Passwort enthält das unerlaubte Muster '%2$s'.

# NumberRangeRule: 1=number
ILLEGAL_NUMBER_RANGE=Die Zahl %1$s darf nicht enthalten sein.
ILLEGAL_NUMBER_RANGE.CONTAINS=Die Zahl %1$s darf nicht enthalten sein.
ILLEGAL_NUMBER_RANGE.STARTS_WITH=Das Passwort darf nicht mit der Zahl %1$s beginnen.
ILLEGAL_NUMBER_RANGE.ENDS_WITH=Das Passwort darf nicht mit der Zahl %1$s enden.
