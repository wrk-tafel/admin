org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Reuses the task graph when no build script, property or environment input changed, skipping the
# configuration phase (about 15 s of each cold CI job). CI keeps the entries in setup-gradle's cache,
# encrypted with the GRADLE_ENCRYPTION_KEY secret; without the key they are simply not saved.
org.gradle.configuration-cache=true
