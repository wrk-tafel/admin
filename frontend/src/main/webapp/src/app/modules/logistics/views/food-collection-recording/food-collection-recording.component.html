<mat-card>
  <mat-card-header>
    <h5>Warenerfassung</h5>
  </mat-card-header>
  <mat-card-content>
    <div class="flex items-center">
      <div class="w-1/4 md:w-1/12">Route</div>
      <div class="w-3/4 md:w-1/3">
        <mat-form-field class="w-full">
          <mat-label>Route auswählen</mat-label>
          <mat-select testid="routeInput" [ngModel]="selectedRoute"
                      (ngModelChange)="onSelectedRouteChange($event)">
            <mat-option [value]="undefined">Bitte auswählen</mat-option>
            @for (route of routeList().routes; track route) {
              <mat-option [value]="route" [attr.testid]="'routeInput-option-' + route.id">{{ route.name }}</mat-option>
            }
          </mat-select>
          <mat-icon matPrefix class="!flex !items-center !justify-center !leading-none !w-5 !h-5 !p-1.5 text-slate-500">
            <fa-icon [icon]="faRoute"></fa-icon>
          </mat-icon>
        </mat-form-field>
      </div>
    </div>
    @if (selectedRouteData()) {
      <hr>
      <mat-tab-group animationDuration="0ms">
        <mat-tab>
          <ng-template mat-tab-label>
            <span testid="select-route-tab">Route</span>
          </ng-template>
          <div class="pt-4">
            <tafel-food-collection-recording-basedata [carList]="carList()"
                                                      [selectedRouteData]="selectedRouteData()">
            </tafel-food-collection-recording-basedata>
          </div>
        </mat-tab>
        <mat-tab>
          <ng-template mat-tab-label>
            <span testid="select-items-tab">Waren</span>
          </ng-template>
          <tafel-food-collection-recording-km [selectedRouteData]="selectedRouteData()">
          </tafel-food-collection-recording-km>
          @if (isDesktopLayout()) {
            <tafel-food-collection-recording-items-desktop [foodCategories]="foodCategories()"
                                                           [selectedRouteData]="selectedRouteData()"></tafel-food-collection-recording-items-desktop>
          } @else {
            <tafel-food-collection-recording-items-responsive [foodCategories]="foodCategories()"
                                                              [selectedRouteData]="selectedRouteData()"></tafel-food-collection-recording-items-responsive>
          }
        </mat-tab>
      </mat-tab-group>
      <hr>
      <button testid="save-button" matButton="filled" [disabled]="saving()" (click)="save()">Speichern</button>
    }
  </mat-card-content>
</mat-card>
