<tafel-dialog type="warning" title="Ungespeicherte Änderungen" testId="unsaved-changes-dialog">
  <div tafel-dialog-content>
    {{ data.message }}
  </div>
  <div tafel-dialog-actions>
    <button testid="leave-button" matButton="filled" class="button-danger" (click)="dialogRef.close(true)">
      {{ data.confirmLabel }}
    </button>
    <button testid="stay-button" matButton="outlined" (click)="dialogRef.close(false)">
      Auf der Seite bleiben
    </button>
  </div>
</tafel-dialog>
