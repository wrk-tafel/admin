<mat-card class="h-full mat-card-{{ panelColor() }}" testid="recorded-food-collections-panel">
  <mat-card-header>
    <mat-card-title>
      <h2 class="tafel-h4 text-white">Erfasste Routen (Anzahl)</h2>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="text-right">
    @if (countRecorded() !== null && countTotal() !== null) {
      <div testid="recorded-food-collections-count" class="text-5xl">{{ countRecorded() }} / {{ countTotal() }}</div>
    } @else {
      <div testid="recorded-food-collections-count" class="text-5xl">-</div>
    }
  </mat-card-content>
</mat-card>
