<mat-card class="h-full mat-card-primary" testid="recorded-route-names-panel">
  <mat-card-content class="!p-4">
    <h2 class="tafel-h4 mb-1">Erfasste Routen (Details)</h2>
    @if (recordedRouteNames() && recordedRouteNames()!.length > 0) {
      <!-- smaller than the figures on the neighbouring panels: this one holds a list of names,
           which at their size would wrap the panel into several lines -->
      <div testid="recorded-route-names" class="text-xl">{{ recordedRouteNames()!.join(', ') }}</div>
    } @else {
      <div testid="recorded-route-names" class="text-4xl leading-none">-</div>
    }
  </mat-card-content>
</mat-card>
