<mat-card class="h-full mat-card-primary" testid="recorded-route-names-panel">
  <mat-card-content class="!p-4">
    <h2 class="tafel-h4 mb-1">Erfasste Routen</h2>
    @if (routes().length > 0) {
      <mat-chip-set testid="recorded-route-chips" aria-label="Erfassungsstatus je Route">
        @for (route of routes(); track route.name; let i = $index) {
          <mat-chip class="route-chip" [class.route-chip-recorded]="route.recorded"
                    [attr.testid]="'recorded-route-chip-' + i"
                    [attr.aria-label]="route.name + (route.recorded ? ' erfasst' : ' ausstehend')">
            @if (route.recorded) {
              <mat-icon svgIcon="check" aria-hidden="true" class="!w-4 !h-4 mr-1"></mat-icon>
            }
            {{ route.name }}
          </mat-chip>
        }
      </mat-chip-set>
    } @else {
      <div testid="recorded-route-names" class="text-4xl leading-none">-</div>
    }
  </mat-card-content>
</mat-card>
