<mat-card class="h-full mat-card-{{ panelColor() }}">
  <mat-card-header>
    <mat-card-title>
      <h2 class="tafel-h4">Tickets abgearbeitet</h2>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="text-right">
    @if (countProcessedTickets() !== null && countTotalTickets() !== null) {
      <div testid="tickets-processed-count" class="text-5xl">{{ countProcessedTickets() }} / {{ countTotalTickets() }}</div>
    } @else {
      <div testid="tickets-processed-count" class="text-5xl">-</div>
    }
  </mat-card-content>
</mat-card>
