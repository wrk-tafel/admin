<tafel-dialog title="Notschlafstellen auswählen">
  <div tafel-dialog-content>
    <form [formGroup]="form" autocomplete="off">
      @if (data.sheltersList && data.sheltersList.length > 0) {
        <div formArrayName="selectedShelters">
          @for (shelter of data.sheltersList; track shelter.id; let idx = $index) {
            @if (idx > 0) {
              <hr/>
            }
            <div class="flex flex-row items-start gap-2">
              <div class="shrink-0">
                <mat-checkbox
                  #shelterCheckbox
                  [formControl]="selectedShelters.controls[idx]"
                  [attr.testid]="'selectable-shelter-row-' + idx"
                ></mat-checkbox>
              </div>
              <div class="flex-grow text-left text-wrap">
                <strong>{{ shelter.name }}</strong>
                <br>
                <!-- [for] targets the checkbox's own generated input id (mat-checkbox wraps its
                     [id] input into "<id>-input" for the actual native input), not a manually
                     assigned one, so this stays correct if that internal naming ever changes. -->
                <label [for]="shelterCheckbox.inputId">
                  {{ formatStreet(shelter) }}
                  <br>
                  {{ shelter.addressPostalCode }} {{ shelter.addressCity }}
                </label>
              </div>
              <div class="text-lg">{{ shelter.personsCount }} Personen</div>
            </div>
          }
        </div>
      }
    </form>
  </div>
  <div tafel-dialog-actions>
    <button testid="selectshelters-save-button" matButton="filled" (click)="save()" [disabled]="form.invalid">Speichern</button>
    <button testid="selectshelters-cancel-button" matButton="outlined" (click)="dialogRef.close()">Abbrechen
    </button>
  </div>
</tafel-dialog>
