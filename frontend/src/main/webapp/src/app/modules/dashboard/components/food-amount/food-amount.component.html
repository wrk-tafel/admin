<mat-card class="h-full mat-card-primary">
  <mat-card-content class="!p-4">
    <h2 class="tafel-h4 mb-1">Erfasste Warenmenge</h2>
    @if (amount() !== null) {
      <div testid="food-amount-total" class="text-4xl leading-none">{{ (amount() | number: '1.2-2') }} kg</div>
    } @else {
      <div testid="food-amount-total" class="text-4xl leading-none">-</div>
    }
  </mat-card-content>
</mat-card>
