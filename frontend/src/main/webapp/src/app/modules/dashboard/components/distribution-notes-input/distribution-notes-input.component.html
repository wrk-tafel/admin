<mat-card class="h-full mat-card-primary">
  <mat-card-header>
    <mat-card-title>
      <h2 class="tafel-h4">Anmerkungen</h2>
    </mat-card-title>
  </mat-card-header>
  <!-- `!flex`: Material's own `.mat-mdc-card-content { display: block }` is a single class like
       the utility and comes later in the cascade, so a plain `flex` here does nothing. -->
  <mat-card-content class="!flex flex-col">
    <!-- appearance="fill" kept (over the app-wide outline default, see app.config.ts) for its
         label sitting fully inside the filled box - an outline field's label instead floats up
         into the notch cut into its border, which needs a background of its own to mask this
         card's purple showing through, and even a corrected one still reads as a patch stuck
         above the field. What actually hid this label - Material's density(-4) setting used
         across the app, applied to fill fields only, below density -3 (see the .scss) - is
         overridden locally instead. -->
    <mat-form-field class="w-full lg:flex-1" appearance="fill">
      <mat-label>Notizen zur Ausgabe</mat-label>
      <textarea
        matInput
        testid="distribution-notes-textarea"
        placeholder="Notizen für diese Ausgabe eingeben ..."
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        rows="4"
        [disabled]="inputIsDisabled()"
      ></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-footer>
    <button
      mat-raised-button
      testid="distribution-notes-save-button"
      (click)="save()"
      [disabled]="inputIsDisabled()"
    >
      Speichern
    </button>
  </mat-card-footer>
</mat-card>
