<mat-card class="h-full mat-card-primary">
  <mat-card-header>
    <mat-card-title>
      <h2 class="tafel-h4">Anmerkungen</h2>
    </mat-card-title>
  </mat-card-header>
  <!-- `!flex`: Material's own `.mat-mdc-card-content { display: block }` is a single class like
       the utility and comes later in the cascade, so a plain `flex` here does nothing. -->
  <mat-card-content class="!flex flex-col">
    <!-- No `appearance="fill"` override: the app-wide default `outline` appearance (see
         app.config.ts) is what keeps this label visible once the field holds anything -
         Material's density(-4) setting used across this app hides a `fill` field's floating
         label entirely (`--mat-form-field-filled-label-display: none`, computed at density < -3),
         regardless of `floatLabel="always"` or an explicit `mat-label`. -->
    <mat-form-field class="w-full lg:flex-1">
      <mat-label>Notizen zur Ausgabe</mat-label>
      <textarea
        matInput
        testid="distribution-notes-textarea"
        placeholder="Notizen für diese Ausgabe eingeben ..."
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        rows="4"
        [disabled]="inputIsDisabled()"
      ></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-footer>
    <button
      mat-raised-button
      testid="distribution-notes-save-button"
      (click)="save()"
      [disabled]="inputIsDisabled()"
    >
      Speichern
    </button>
  </mat-card-footer>
</mat-card>
