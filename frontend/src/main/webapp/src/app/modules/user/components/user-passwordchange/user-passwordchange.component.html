<mat-card appearance="outlined" class="shadow-sm">
  <mat-card-header>
    <mat-card-title>
      Passwort ändern
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="pt-6">
    <tafel-passwordchange-form></tafel-passwordchange-form>
  </mat-card-content>

  <mat-card-actions align="start">
    <button
      mat-flat-button
      testid="saveButton"
      (click)="changePassword()"
      [disabled]="isSaveDisabled()"
    >
      Speichern
    </button>
  </mat-card-actions>
</mat-card>
