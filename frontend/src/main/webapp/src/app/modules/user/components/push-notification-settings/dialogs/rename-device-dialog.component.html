<tafel-dialog testId="rename-device-dialog" type="info" title="Gerät benennen">
  <div tafel-dialog-content>
    <mat-form-field class="w-full">
      <mat-label>Name</mat-label>
      <input testid="rename-device-label-input" matInput type="text" maxlength="100"
             placeholder="z. B. Kiosk Ausgabe 1"
             [ngModel]="labelInput()" (ngModelChange)="labelInput.set($event)">
    </mat-form-field>
  </div>
  <div tafel-dialog-actions>
    <button testid="okButton" matButton="filled" (click)="save()">Speichern</button>
    <button testid="cancelButton" matButton="outlined" (click)="dialogRef.close()">Abbrechen</button>
  </div>
</tafel-dialog>
