<div class="absolute inset-0 size-full">
  <tafel-ticket-screen [soundEnabled]="soundEnabled"></tafel-ticket-screen>

  @if (fullscreenSupported && showFullscreenButton()) {
    <button
      testid="fullscreen-button"
      type="button"
      class="absolute bottom-6 right-6 z-20 flex items-center gap-2 rounded-full bg-white/10 px-5 py-3 text-white backdrop-blur transition-opacity duration-700 hover:bg-white/20"
      (click)="enterFullscreen()"
    >
      <mat-icon svgIcon="fullscreen" aria-hidden="true"></mat-icon>
      Vollbild
    </button>
  }
</div>
