<div class="relative h-full w-full flex flex-col items-center justify-center bg-black overflow-hidden">
  @if (!connected()) {
    <!-- Same "role=status" live-region model as before, just sized to read from across a hall
         instead of a small corner badge - a stale ticket number that still looks current would
         actively mislead the queue, so this needs to be impossible to miss. -->
    <div testid="connectionState" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-6 bg-black/85 text-center px-8" role="status">
      <fa-icon [icon]="faLinkSlash" aria-hidden="true" class="text-white text-[4em]"></fa-icon>
      <div class="text-white text-[3em] font-semibold">Verbindung getrennt</div>
      @if (lastUpdateAt(); as lastUpdate) {
        <div testid="lastUpdateText" class="text-white/80 text-[1.6em]">letzte Anzeige {{ lastUpdate | date:'HH:mm' }}</div>
      }
    </div>
  }
  <!-- role="status": the called ticket arrives over SSE and is the entire point of the screen,
       with nothing else changing to give it away. Dimmed while disconnected so the overlay above
       reads as authoritative rather than competing with a still-bright, possibly stale number. -->
  <div role="status" class="flex flex-col items-center transition-opacity duration-500" [class.opacity-30]="!connected()">
    <div testid="title" class="mt-12 text-white text-[10em]">{{ text() }}</div>
    <div testid="text" class="text-white text-[23em]" [class.tafel-ticket-screen-pulse]="justChanged()">{{ value() }}</div>
    @if (previousTicketValue(); as previousValue) {
      <div testid="previousTicket" class="text-white/60 text-[3em] -mt-8">Zuvor: {{ previousValue }}</div>
    }
  </div>
</div>
