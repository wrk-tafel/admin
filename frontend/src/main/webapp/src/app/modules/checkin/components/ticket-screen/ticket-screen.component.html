<div class="relative h-full w-full flex flex-col items-center justify-center bg-black">
  @if (!connected()) {
    <!-- Same model as the header's live-connection badge: the icon carries the state as a shape,
         so the badge does not rest on its red alone. -->
    <span testid="connectionState" class="badge badge-danger absolute top-4 right-4" role="status">
      <fa-icon [icon]="faLinkSlash" aria-hidden="true"></fa-icon>
      Verbindung getrennt
    </span>
  }
  <!-- role="status": the called ticket arrives over SSE and is the entire point of the screen,
       with nothing else changing to give it away. -->
  <div role="status" class="flex flex-col items-center">
    <div testid="title" class="mt-12 text-white text-[10em]">{{ text() }}</div>
    <div testid="text" class="text-white text-[23em]">{{ value() }}</div>
  </div>
</div>
