<div class="relative h-full w-full flex flex-col items-center justify-center bg-black">
  @if (!connected()) {
    <span testid="connectionState" class="badge badge-danger absolute top-4 right-4">Verbindung getrennt</span>
  }
  <div testid="title" class="mt-12 text-white text-[10em]">{{ text() }}</div>
  <div testid="text" class="text-white text-[23em]">{{ value() }}</div>
</div>
