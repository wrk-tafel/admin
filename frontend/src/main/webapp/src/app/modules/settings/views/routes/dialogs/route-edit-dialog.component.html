<tafel-dialog [title]="title" testId="route-edit-dialog">
  <div tafel-dialog-content>
    <form [formGroup]="form" class="grid grid-cols-1">
      <mat-form-field>
        <mat-label>Nummer</mat-label>
        <input matInput type="number" step="0.1" formControlName="number" testid="route-number-input"/>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" testid="route-name-input"/>
      </mat-form-field>

      <mat-checkbox formControlName="enabled" class="mb-6" testid="route-enabled-checkbox">Aktiv</mat-checkbox>

      <mat-form-field>
        <mat-label>Hinweis</mat-label>
        <textarea matInput formControlName="note" placeholder="Notiz für diese Route eingeben ..."
                  rows="5" testid="route-note-input"></textarea>
      </mat-form-field>

      <div class="mt-6">
        <h4 class="mb-2">Stopps</h4>
        <div formArrayName="stops">
          @for (stopCtrl of stops.controls; track i; let i = $index) {
            @if (i > 0) {
              <mat-divider class="!my-6"></mat-divider>
            }
            <div [formGroupName]="i" [attr.testid]="'route-stop-' + i">
              <div class="flex gap-2">
                <mat-form-field class="w-40">
                  <mat-label>Uhrzeit</mat-label>
                  <input matInput type="time" formControlName="time" [attr.testid]="'route-stop-time-input-' + i"/>
                </mat-form-field>
                <mat-form-field class="flex-1">
                  <mat-label>Filiale</mat-label>
                  <mat-select formControlName="shopId" [attr.testid]="'route-stop-shop-select-' + i">
                    <mat-option [value]="null">Keine Filiale</mat-option>
                    @for (shop of shops; track shop.id) {
                      <mat-option [value]="shop.id">{{ shop.number }} - {{ shop.name }}</mat-option>
                    }
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="flex gap-2 mt-2">
                <mat-form-field class="flex-1">
                  <mat-label>Beschreibung</mat-label>
                  <input matInput formControlName="description"
                         [attr.testid]="'route-stop-description-input-' + i"/>
                </mat-form-field>
                <button matButton="outlined" type="button" [attr.testid]="'route-stop-remove-button-' + i"
                        (click)="removeStop(i)">Entfernen
                </button>
              </div>
            </div>
          }
        </div>

        <button matButton="filled" type="button" testid="route-stop-add-button" (click)="addStop()">
          Stopp hinzufügen
        </button>
      </div>
    </form>
  </div>

  <div tafel-dialog-actions>
    <button matButton="filled" testid="route-save-button" (click)="save()">Speichern</button>
    <button matButton="outlined" testid="route-cancel-button" (click)="cancel()">Abbrechen</button>
  </div>
</tafel-dialog>
