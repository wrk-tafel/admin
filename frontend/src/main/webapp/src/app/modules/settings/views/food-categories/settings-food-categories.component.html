<mat-card class="w-full">
  <mat-card-header class="mb-2">
    <mat-card-title>
      <div class="flex items-center gap-2">
        <h5 class="mb-0 mt-1">Lebensmittelkategorien</h5>
        <button matButton="filled" class="button-success" testid="addFoodCategoryButton" (click)="addFoodCategory()">
          <fa-icon [icon]="faPlus"></fa-icon>
        </button>
      </div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="foodCategories()" testid="food-categories-table">
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Aktiv</th>
        <td mat-cell *matCellDef="let category; let i = index">
          @if (category.enabled) {
            <button matButton="filled" class="button-success ms-2" testid="enableFoodCategoryButton"
                    (click)="toggleFoodCategoryVisibility(category, false)">
              <fa-icon [icon]="faEye"></fa-icon>
            </button>
          } @else {
            <button matButton="filled" class="button-danger ms-2" testid="disableFoodCategoryButton"
                    (click)="toggleFoodCategoryVisibility(category, true)">
              <fa-icon [icon]="faEyeSlash"></fa-icon>
            </button>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category; let i = index">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="weightPerUnit">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-2 text-left">Gewicht pro Einheit (kg)</th>
        <td mat-cell *matCellDef="let category; let i = index">{{ category.weightPerUnit }}</td>
      </ng-container>

      <ng-container matColumnDef="returnItem">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-2 text-left">Pfandartikel</th>
        <td mat-cell *matCellDef="let category; let i = index">{{ category.returnItem ? 'Ja' : 'Nein' }}</td>
      </ng-container>

      <ng-container matColumnDef="sortOrder">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-2 text-left">Sortierung</th>
        <td mat-cell *matCellDef="let category; let i = index">{{ category.sortOrder }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-2 text-left">Aktionen</th>
        <td mat-cell *matCellDef="let category; let i = index">
          <button matButton="filled" class="button-danger" [attr.testid]="'edit-foodcategory-button-' + i"
                  (click)="editFoodCategory(category)">
            <fa-icon [icon]="faPencil"></fa-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"
          [class.opacity-50]="!row.enabled"
          [attr.testid]="'food-categories-row-' + i"></tr>
    </table>
  </mat-card-content>
</mat-card>
