<div class="flex flex-col gap-6" testid="settings-overview">
  @for (group of groups(); track group.title) {
    <section [attr.aria-labelledby]="'settings-group-' + $index">
      <h2 class="tafel-h5 mb-3" [id]="'settings-group-' + $index">{{ group.title }}</h2>
      <ul class="grid gap-3 grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 list-none p-0 m-0">
        @for (entry of group.entries; track entry.url) {
          <li>
            <a [routerLink]="entry.url" [attr.testid]="'settings-overview-' + entry.url"
               class="block h-full rounded-lg border border-slate-300 bg-[var(--tafel-surface)] p-4 no-underline hover:border-slate-500 focus-visible:outline focus-visible:outline-2">
              <span class="block font-semibold">{{ entry.name }}</span>
              @if (entry.description) {
                <span class="block mt-1 text-sm text-slate-600">{{ entry.description }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </section>
  }
</div>
