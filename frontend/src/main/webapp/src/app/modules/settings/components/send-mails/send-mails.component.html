<div class="flex gap-6">
  <mat-card class="w-full">
    <mat-card-header>
      <mat-card-title>
        <div class="flex items-center gap-2">
          <mat-icon svgIcon="mail" />
          <h2 class="tafel-h5 mb-0 mt-1">E-Mails erneut senden</h2>
        </div>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="mb-4 text-sm text-slate-600">
        Versendet die Mails eines bereits beendeten Ausgabetags noch einmal an die oben
        hinterlegten Empfänger.
      </p>

      <mat-form-field class="w-full" subscriptSizing="dynamic">
        <mat-label>Ausgabe vom:</mat-label>
        <mat-select [value]="selectedDistribution()" (selectionChange)="selectedDistribution.set($event.value)">
          @for (distribution of distributions(); track distribution) {
            <mat-option [value]="distribution">
              {{ distribution.startedAt | date : 'dd.MM.yyyy' }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>
    <mat-card-footer>
      <button matButton="filled"
              [disabled]="!selectedDistribution()"
              (click)="sendMails()">
        E-Mails erneut senden
      </button>
    </mat-card-footer>
  </mat-card>
</div>
