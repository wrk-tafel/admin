<div class="flex gap-6">
  <mat-card class="w-full">
    <mat-card-header>
      <mat-card-title>
        <div class="flex items-center gap-2">
          <mat-icon svgIcon="mail" />
          <h2 class="tafel-h5 mb-0 mt-1">E-Mails erneut senden</h2>
        </div>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="mb-4 text-sm text-slate-600">
        Versendet die Mails eines bereits beendeten Ausgabetags noch einmal an die oben
        hinterlegten Empfänger.
      </p>

      <mat-form-field class="w-full" subscriptSizing="dynamic">
        <mat-label>Ausgabe vom:</mat-label>
        <!-- an autocomplete rather than a plain select: this list accumulates for as long as the
             Tafel runs, so it needs to stay searchable rather than scrolled through -->
        <input matInput type="text" autocomplete="off" testid="sendMailsDistributionInput"
               [matAutocomplete]="sendMailsDistributionAutocomplete"
               [ngModel]="distributionDisplayText()" [ngModelOptions]="{standalone: true}"
               (ngModelChange)="onDistributionInput($event)"
               (blur)="onDistributionBlur()">
        <mat-autocomplete #sendMailsDistributionAutocomplete="matAutocomplete"
                          [displayWith]="distributionAutocompleteDisplay"
                          (optionSelected)="onDistributionSelected($event.option.value)">
          @for (distribution of distributionOptions(); track distribution.id) {
            <mat-option [value]="distribution" [attr.testid]="'sendMailsDistributionInput-option-' + distribution.id">{{ distributionLabel(distribution) }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </mat-card-content>
    <mat-card-footer>
      <button matButton="filled" testid="send-mails-button"
              [disabled]="!selectedDistribution()"
              (click)="sendMails()">
        E-Mails erneut senden
      </button>
    </mat-card-footer>
  </mat-card>
</div>
