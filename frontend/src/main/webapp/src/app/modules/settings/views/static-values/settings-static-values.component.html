<mat-card class="w-full">
  <mat-card-header class="mb-2">
    <mat-card-title>
      <h5 class="mb-0 mt-1">Statische Werte</h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="staticValues()?.staticValues ?? []" testid="static-values-table">
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Typ</th>
        <td mat-cell *matCellDef="let staticValue">{{ typeLabel(staticValue.type) }}</td>
      </ng-container>

      <ng-container matColumnDef="validFrom">
        <th mat-header-cell *matHeaderCellDef>Gültig von</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.validFrom }}</td>
      </ng-container>

      <ng-container matColumnDef="validTo">
        <th mat-header-cell *matHeaderCellDef>Gültig bis</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.validTo }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Betrag</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.amount }}</td>
      </ng-container>

      <ng-container matColumnDef="countAdults">
        <th mat-header-cell *matHeaderCellDef>Anz. Erwachsene</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.countAdults }}</td>
      </ng-container>

      <ng-container matColumnDef="countChildren">
        <th mat-header-cell *matHeaderCellDef>Anz. Kinder</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.countChildren }}</td>
      </ng-container>

      <ng-container matColumnDef="age">
        <th mat-header-cell *matHeaderCellDef>Alter</th>
        <td mat-cell *matCellDef="let staticValue">{{ staticValue.age }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Aktionen</th>
        <td mat-cell *matCellDef="let staticValue; let i = index">
          <button matButton="filled" class="button-danger" [attr.testid]="'editStaticValueButton-' + i"
                  (click)="editStaticValue(staticValue)">
            <fa-icon [icon]="faPencil"></fa-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"
          [attr.testid]="'static-values-row-' + i"></tr>
    </table>
  </mat-card-content>
</mat-card>
