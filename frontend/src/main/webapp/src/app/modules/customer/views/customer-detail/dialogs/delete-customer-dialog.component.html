<tafel-dialog testId="deletecustomer-dialog" type="warning" title="Kunde löschen">
  <div tafel-dialog-content>
    <div class="mb-2">Der Kunde <strong testid="deletecustomer-name">{{data.customerName}}</strong> wird unwiderruflich gelöscht.</div>
    @if (data.ticketNumber) {
      <div class="mb-2" testid="deletecustomer-ticket-warning">Ticket Nr. {{data.ticketNumber}} wird aus der laufenden Ausgabe entfernt.</div>
    }
    <div class="font-bold mt-6">Sicher?</div>
  </div>
  <div tafel-dialog-actions>
    <button testid="okButton" matButton="filled" (click)="dialogRef.close(true)">Löschen</button>
    <button testid="cancelButton" matButton="outlined" (click)="dialogRef.close()">Abbrechen</button>
  </div>
</tafel-dialog>
