<tafel-dialog type="info" title="Alle Notizen">
  <div tafel-dialog-content>
    <mat-paginator class="tafel-paginator-center" [length]="notesResponse().totalCount" [pageSize]="notesResponse().pageSize"
                   [pageSizeOptions]="pageSizeOptions"
                   [pageIndex]="notesResponse().currentPage - 1" [showFirstLastButtons]="true"
                   (page)="getCustomerNotes($event.pageIndex + 1, $event.pageSize)"></mat-paginator>
    @for (noteItem of notesResponse().items; track noteItem.id; let i = $index) {
      @if (i > 0) {
        <hr>
      }
      <div class="mb-2 flex justify-between items-start gap-2">
        <div class="min-w-0">
          <div class="font-bold" testid="note-title">
            {{noteItem.timestamp | date : 'dd.MM.yyyy HH:mm' }}&nbsp;{{noteItem.author}}
          </div>
          <div class="whitespace-pre-line" testid="note-text">{{noteItem.note}}</div>
        </div>
        @if (noteItem.editable) {
          <div class="flex gap-2 shrink-0">
            <button type="button" testid="note-editButton" matButton="filled" (click)="editNote(noteItem)"
                    matTooltip="Notiz bearbeiten" aria-label="Notiz bearbeiten">
              <mat-icon svgIcon="edit"></mat-icon>
            </button>
            <button type="button" testid="note-deleteButton" matButton="filled" class="button-danger" (click)="deleteNote(noteItem)"
                    matTooltip="Notiz löschen" aria-label="Notiz löschen">
              <mat-icon svgIcon="delete"></mat-icon>
            </button>
          </div>
        }
      </div>
    }
    <mat-paginator class="tafel-paginator-center mt-6" [length]="notesResponse().totalCount" [pageSize]="notesResponse().pageSize"
                   [pageSizeOptions]="pageSizeOptions"
                   [pageIndex]="notesResponse().currentPage - 1" [showFirstLastButtons]="true"
                   (page)="getCustomerNotes($event.pageIndex + 1, $event.pageSize)"></mat-paginator>
  </div>
  <div tafel-dialog-actions>
    <button testid="cancelButton" matButton="filled" (click)="dialogRef.close()">OK</button>
  </div>
</tafel-dialog>
