<tafel-dialog type="info" title="Alle Notizen">
  <div tafel-dialog-content>
    @if (paginationData()) {
      <tafel-pagination class="hidden sm:block" align="center" [paginationData]="paginationData()" (pageChanged)="getCustomerNotes($event)"></tafel-pagination>
      <tafel-pagination class="block sm:hidden" align="center" size="sm" [paginationData]="paginationData()" (pageChanged)="getCustomerNotes($event)"></tafel-pagination>
    }
    @for (noteItem of customerNotes(); track noteItem.timestamp; let i = $index) {
      @if (i > 0) {
        <hr>
      }
      <div class="mb-2">
        <div class="font-bold" testid="note-title">
          {{noteItem.timestamp | date : 'dd.MM.yyyy HH:mm' }}&nbsp;{{noteItem.author}}
        </div>
        <div>{{noteItem.note}}</div>
      </div>
    }
    @if (paginationData()) {
      <tafel-pagination class="hidden sm:block mt-6" align="center" [paginationData]="paginationData()" (pageChanged)="getCustomerNotes($event)"></tafel-pagination>
      <tafel-pagination class="block sm:hidden mt-6" align="center" size="sm" [paginationData]="paginationData()" (pageChanged)="getCustomerNotes($event)"></tafel-pagination>
    }
  </div>
  <div tafel-dialog-actions>
    <button testid="cancelButton" matButton="filled" (click)="dialogRef.close()">OK</button>
  </div>
</tafel-dialog>
