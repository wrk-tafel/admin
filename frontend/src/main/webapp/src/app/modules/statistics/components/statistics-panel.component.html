<mat-card class="w-full h-full">
  <mat-card-content>
    <div class="text-sm">{{ $safeNavigationMigration(data()?.subTitle) }}</div>
    <div class="text-2xl font-bold">{{ data()?.title }}</div>
    <canvas baseChart class="mt-3 mx-3" height="80"
            [type]="'line'" [data]="chartData()" [options]="optionsDefault"></canvas>
  </mat-card-content>
</mat-card>
