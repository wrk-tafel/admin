<div class="flex items-center justify-between border-b px-4 h-16">
  <button (click)="toggleSidebar.emit()" aria-label="Menü ein-/ausklappen"
          class="w-9 h-9 flex items-center justify-center rounded hover:bg-gray-100">
    <fa-icon [icon]="faBars"></fa-icon>
  </button>

  <div class="flex items-center gap-4">
    <span class="badge" [ngClass]="sseConnected() === false ? 'badge-danger' : 'badge-success'">Live-Verbindung</span>

    <button [matMenuTriggerFor]="userMenu" testid="usermenu" aria-label="Öffne Benutzermenü"
            class="w-9 h-9 rounded overflow-hidden border">
      <img src="./assets/img/user/user.svg" alt="Benutzer-Avatar" class="w-full h-full object-cover"/>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="px-4 py-2 font-semibold bg-gray-100">Benutzer</div>
      <a mat-menu-item [routerLink]="['/passwortaendern']" testid="usermenu-changepassword">
        <fa-icon [icon]="faKey"></fa-icon> Passwort ändern
      </a>
      <mat-divider></mat-divider>
      <a mat-menu-item [routerLink]="[]" testid="usermenu-logout" (click)="logout()">
        <fa-icon [icon]="faLock"></fa-icon> Abmelden
      </a>
    </mat-menu>
  </div>
</div>
