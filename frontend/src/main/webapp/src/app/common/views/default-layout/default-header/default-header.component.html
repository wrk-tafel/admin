<div class="flex items-center justify-between border-b border-gray-200 px-6 h-16">
  <div class="flex items-center gap-2">
    <button (click)="toggleSidebar.emit()" aria-label="Menü ein-/ausklappen"
            class="w-9 h-9 flex items-center justify-center rounded-md hover:bg-gray-100">
      <fa-icon [icon]="faBars"></fa-icon>
    </button>

    <button (click)="openSupportDialog()" matButton="filled" testid="supportButton" aria-label="Support-Anfrage senden"
            class="!h-7 !px-2 !text-xs sm:!h-9 sm:!px-3 sm:!text-sm flex items-center justify-center rounded-md hover:bg-gray-100 font-medium">
      Support-Anfrage
    </button>
  </div>

  <div class="flex items-center gap-6">
    <!--
      Colour is the only thing that told the two states apart, which says nothing to a screen
      reader. The state now sits in the badge's own text as well, visually hidden; `role="status"`
      makes the badge a live region, so a connection that drops is announced instead of silently
      turning red.
    -->
    <span class="badge" role="status" [ngClass]="!sseConnected() ? 'badge-danger' : 'badge-success'">Live-Verbindung<span
      class="sr-only"> {{ sseConnected() ? 'besteht' : 'unterbrochen' }}</span></span>

    <button [matMenuTriggerFor]="userMenu" testid="usermenu" aria-label="Öffne Benutzermenü"
            class="w-9 h-9 rounded-md overflow-hidden">
      <img ngSrc="./assets/img/user/user.svg" width="36" height="36" alt="Benutzer-Avatar" class="w-full h-full object-cover cursor-pointer"/>
    </button>
    <mat-menu #userMenu="matMenu">
      <!-- --tafel-background-secondary (defined in _theme.scss) is the same variable the sidebar itself uses (default-layout.component.scss). -->
      <div class="px-6 py-2 text-xs uppercase tracking-wide text-gray-100 font-semibold bg-[var(--tafel-background-secondary)]">Benutzer</div>
      <a mat-menu-item [routerLink]="['/passwortaendern']" testid="usermenu-changepassword">
        <fa-icon [icon]="faKey"></fa-icon> Passwort ändern
      </a>
      <a mat-menu-item [routerLink]="['/benachrichtigungen']" testid="usermenu-pushnotifications">
        <fa-icon [icon]="faBell"></fa-icon> Benachrichtigungen
      </a>
      <mat-divider></mat-divider>
      <a mat-menu-item [routerLink]="[]" testid="usermenu-logout" (click)="logout()">
        <fa-icon [icon]="faLock"></fa-icon> Abmelden
      </a>
    </mat-menu>
  </div>
</div>
