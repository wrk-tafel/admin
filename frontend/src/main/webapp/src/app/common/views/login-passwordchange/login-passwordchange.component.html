<main class="min-h-dvh flex items-center justify-center bg-[var(--tafel-background-secondary)] p-6">
  <div class="w-full max-w-2xl">
    <mat-card class="p-6 md:p-8 shadow-md">
      <mat-card-content>
        <div class="flex flex-col items-center mb-8 text-center">
          <img
            ngSrc="assets/img/brand/logo.svg"
            width="200"
            height="54"
            priority
            alt="Logo"
            class="mb-6 h-[54px] w-[200px] object-contain"
          />
          <h1 class="tafel-h3 mat-headline-6 font-semibold text-slate-800">
            Tafel Admin - Passwort ändern
          </h1>
          <p class="text-sm text-slate-600 mt-2" testid="reasonHint">
            Ihr Passwort muss geändert werden, bevor Sie fortfahren können.
          </p>
        </div>

        <div class="mb-6">
          <tafel-passwordchange-form></tafel-passwordchange-form>
        </div>

        @if (reLoginInProgress()) {
          <div class="flex flex-col gap-2 mt-6" testid="reLoginProgress" role="status">
            <span class="text-sm text-slate-700">Passwort geändert – Anmeldung läuft…</span>
            <mat-progress-bar mode="indeterminate" class="!h-2 !rounded-full"></mat-progress-bar>
          </div>
        } @else {
          <div class="flex flex-row justify-start gap-2 mt-6">
            <button
              matButton="filled"
              testid="saveButton"
              (click)="changePassword()"
              [disabled]="saveDisabled()"
            >
              Speichern
            </button>
            <button
              matButton="outlined"
              type="button"
              testid="cancelButton"
              (click)="cancel()"
            >
              Abmelden
            </button>
          </div>
        }
      </mat-card-content>
    </mat-card>
  </div>
</main>
