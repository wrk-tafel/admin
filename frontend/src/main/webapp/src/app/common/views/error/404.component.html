<main class="min-h-dvh flex flex-col items-center justify-center bg-[var(--tafel-background-secondary)] p-6">
  <div class="w-full max-w-2xl flex flex-col items-center text-center">
    <img ngSrc="assets/img/brand/logo.svg" width="200" height="54" priority alt="ÖRK Logo" class="mb-10 h-[54px] w-[200px] object-contain"/>

    <div class="flex flex-col md:flex-row items-center gap-6 mb-10">
      <h1 testid="status" class="text-7xl font-light text-white leading-none">404</h1>

      <div class="hidden md:block self-stretch w-px bg-gray-700 mx-2"></div>

      <div class="flex flex-col items-center md:items-start">
        <h2 testid="title" class="mat-h4 text-xl font-semibold mb-1 text-white">Seite nicht gefunden</h2>
        <p testid="subtitle" class="text-gray-300 italic">Diese Bananenkiste ist wohl leer</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3">
      <a routerLink="/uebersicht" testid="backToOverviewButton"
         class="inline-flex items-center justify-center rounded-md bg-blue-600 px-5 py-2.5 text-sm font-medium text-white
                hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400">Zur Übersicht</a>
      <button type="button" (click)="goBack()" testid="backButton"
              class="inline-flex items-center justify-center rounded-md border border-gray-500 px-5 py-2.5 text-sm font-medium text-white
                     hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400">Zurück</button>
    </div>
  </div>
</main>
