<div class="flex items-center gap-1"
     [class.justify-start]="align() === 'start'"
     [class.justify-center]="align() === 'center'"
     [class.justify-end]="align() === 'end'">
  <button matIconButton [disabled]="currentPage === 1" (click)="selectFirstPage()" [class.scale-75]="size() === 'sm'">
    <span aria-hidden="true">&lt;&lt;</span>
  </button>
  <button matIconButton [disabled]="currentPage === 1" (click)="selectPreviousPage()" [class.scale-75]="size() === 'sm'">
    <span aria-hidden="true">&lt;</span>
  </button>
  <div class="mx-4" [class.text-sm]="size() === 'sm'">{{text}}</div>
  <button matIconButton [disabled]="currentPage === maxPage" (click)="selectNextPage()" [class.scale-75]="size() === 'sm'">
    <span aria-hidden="true">&gt;</span>
  </button>
  <button matIconButton [disabled]="currentPage === maxPage" (click)="selectLastPage()" [class.scale-75]="size() === 'sm'">
    <span aria-hidden="true">&gt;&gt;</span>
  </button>
</div>
