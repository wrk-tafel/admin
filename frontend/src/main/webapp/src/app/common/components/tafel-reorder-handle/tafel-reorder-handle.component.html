<button type="button" class="cursor-move" [attr.testid]="testId()"
        [attr.aria-label]="label() + ', Position ' + position() + ' von ' + count() + ', mit den Pfeiltasten verschieben'"
        (keydown)="onKeydown($event)"
        matTooltip="Zum Ändern der Reihenfolge ziehen oder mit den Pfeiltasten verschieben">
  <mat-icon svgIcon="drag_indicator"></mat-icon>
</button>
